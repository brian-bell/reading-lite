# Test-only wrangler config used by vitest-pool-workers / Miniflare.
# Omits the Vectorize binding (Miniflare has no native Vectorize stub);
# tests inject a fake VectorizeIndex via the SimilarityStore constructor.

name = "reading-lite-test"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

[vars]
CORS_ALLOWED_ORIGINS = ""
PENDING_TTL_SECONDS = "300"
FETCH_TIMEOUT_MS = "20000"
FETCH_MAX_BYTES = "10485760"
ANTHROPIC_MODEL = "claude-sonnet-4-6"
READER_API_TOKEN = "test-token"
ANTHROPIC_API_KEY = "test-anthropic-key"
OPENAI_API_KEY = "test-openai-key"

[[r2_buckets]]
binding = "READINGS_BUCKET"
bucket_name = "reading-lite-test"
