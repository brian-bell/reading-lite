# Test-only wrangler config used by vitest-pool-workers / Miniflare.
# No cron / DIGEST_JOBS / ACCOUNT_WIPE_JOBS binding: digest and wipe due+enqueue
# are exercised by calling fanOutDueDigests / fanOutDueAccountWipes / scheduled()
# with a frozen now in tests.

name = "reading-lite-test"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AuthRateGuard"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["TenantUsageGuard"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["GlobalUsageGuard"]

[vars]
APP_ENV = "test"
CORS_ALLOWED_ORIGINS = ""
MCP_ALLOWED_ORIGINS = "https://reading.test.example"
PENDING_TTL_SECONDS = "300"
FETCH_TIMEOUT_MS = "20000"
FETCH_MAX_BYTES = "10485760"
ANTHROPIC_MODEL = "claude-sonnet-5"
SUMMARIZER_PROVIDER = "openai"
OPENAI_SUMMARIZATION_MODEL = "gpt-5.6-terra"
OPENAI_SUMMARIZATION_REASONING_EFFORT = "low"
ANTHROPIC_SUMMARIZATION_REASONING_EFFORT = "low"
READER_API_TOKEN = "test-token"
AUTH_ROOT_SECRET = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
FOUNDER_EMAIL = "founder@test.example"
ANTHROPIC_API_KEY = "test-anthropic-key"
OPENAI_API_KEY = "test-openai-key"
X_API_BEARER_TOKEN = "test-x-token"
RESEND_API_KEY = "test-resend-key"
EMAIL_FROM = "reading-lite@test.example"
EMAIL_TO = "reader@test.example"
WEB_BASE_URL = "https://reading.test.example"
TENANT_DATA_PLANE = "1"
LOCAL_MAIL_SINK = "1"
AUTH_RATE_EMAIL_MAX = "1000"
AUTH_RATE_IP_MAX = "1000"
AUTH_RATE_GLOBAL_MAX = "10000"

[[r2_buckets]]
binding = "READINGS_BUCKET"
bucket_name = "reading-lite-test"

[[durable_objects.bindings]]
name = "AUTH_RATE_GUARD"
class_name = "AuthRateGuard"

[[durable_objects.bindings]]
name = "TENANT_USAGE_GUARD"
class_name = "TenantUsageGuard"

[[durable_objects.bindings]]
name = "GLOBAL_USAGE_GUARD"
class_name = "GlobalUsageGuard"

# PostgreSQL through Hyperdrive (ADR 0005). Locally Hyperdrive is a passthrough
# to this connection string: the docker-compose `postgres` service on its
# non-default host port. The binding must be declared here, but
# vitest.workspace.ts always replaces this string (Miniflare `hyperdrives`)
# with the database globalSetup prepares: per checkout locally,
# TEST_DATABASE_URL in CI. Tests never connect to Neon.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "00000000000000000000000000000099"
localConnectionString = "postgres://reading_lite:reading_lite@127.0.0.1:54329/reading_lite_test"
