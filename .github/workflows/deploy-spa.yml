# Deploy the production SPA after the Worker release succeeds. The Worker run's
# release artifact pins this upload to the same tested and released main SHA.
#
# The same run also deploys the new frontend Worker (app/), which owns
# next.readinglite.ai and, since the Phase 5 cutover (reading-lite-gh340.4), the
# apex hosts readinglite.ai and readinglite.app (ADR 0003). It is a job here
# rather than its own workflow: the release concurrency group keeps only one
# pending run, so a second workflow queued behind the Worker release could
# cancel this one or be cancelled by it. The two jobs are independent: a
# frontend failure leaves the previous frontend version serving the apex hosts,
# and the SPA keeps deploying to Pages, which stays bound there as the rollback
# target (delete the frontend's apex routes to fall back to it).

name: Deploy production SPA

on:
  workflow_run:
    workflows: [Deploy production worker]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production-release
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Build and deploy
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_run' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://readinglite.ai
    steps:
      - name: Download the released Worker SHA
        uses: actions/download-artifact@v7
        with:
          name: production-worker-release-sha
          path: .release
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Validate the released Worker SHA
        id: release
        run: |
          release_sha="$(tr -d '\r\n' < .release/sha)"
          [[ "$release_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "invalid production Worker release SHA"
            exit 1
          }
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Install deployment dependencies
        run: npm ci
      - name: Install SPA dependencies
        working-directory: web
        run: npm ci
      - name: Require Cloudflare deploy secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "missing secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "missing secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Build and deploy production SPA
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "${{ steps.release.outputs.sha }}" || {
            echo "refusing stale SPA release: main advanced past ${{ steps.release.outputs.sha }}"
            exit 1
          }
          npm run ops -- deploy web --branch main --execute

  app:
    name: Build and deploy frontend Worker (readinglite.ai, readinglite.app, next.readinglite.ai)
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_run' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://readinglite.ai
    steps:
      - name: Download the released Worker SHA
        uses: actions/download-artifact@v7
        with:
          name: production-worker-release-sha
          path: .release
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Validate the released Worker SHA
        id: release
        run: |
          release_sha="$(tr -d '\r\n' < .release/sha)"
          [[ "$release_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "invalid production Worker release SHA"
            exit 1
          }
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.sha }}
      # @tanstack/react-start requires Node >=22.12 (ADR 0003).
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci
      - name: Require Cloudflare deploy secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "missing secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "missing secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Build the production frontend
        working-directory: app
        env:
          CLOUDFLARE_ENV: production
        run: |
          npm run build
          # The built config is what deploys: check its environment, routes,
          # and BACKEND binding against wrangler.jsonc and the backend's.
          node scripts/check-build.ts production
      - name: Deploy the production frontend
        working-directory: app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "${{ steps.release.outputs.sha }}" || {
            echo "refusing stale frontend release: main advanced past ${{ steps.release.outputs.sha }}"
            exit 1
          }
          npx wrangler deploy
      - name: Smoke-check route precedence on every production host
        run: |
          app/scripts/smoke-host.sh https://next.readinglite.ai
          app/scripts/smoke-host.sh https://readinglite.ai
          app/scripts/smoke-host.sh https://readinglite.app
