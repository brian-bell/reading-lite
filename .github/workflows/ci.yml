name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # No CI run means no workflow_run production deployment for these pushes.
    # Keep this list in sync with the PR classifier below. PRs must still emit
    # the existing job checks so required checks do not remain pending.
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.agents/**/*.md'
      - '.claude/**/*.md'
      - '.beads/**'
      - 'LICENSE'
      - 'skills-lock.json'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Check for code changes
    # Toggle PR checks with the DISABLE_PR_CI repository variable; main always runs.
    if: github.event_name != 'pull_request' || vars.DISABLE_PR_CI != 'true'
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          # Pushes already passed paths-ignore. Compare the entire PR, including
          # deleted paths; disabling rename detection also checks the old path.
          if [[ "$EVENT_NAME" != pull_request ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --no-renames --name-only -z "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed-paths"
          code=false
          while IFS= read -r -d '' path; do
            case "$path" in
              docs/*|.agents/*.md|.claude/*.md|.beads/*|LICENSE|skills-lock.json) continue ;;
            esac
            # Only root Markdown is ignored here; Markdown test fixtures and
            # application assets elsewhere still need the normal checks.
            if [[ "$path" != */* && "$path" == *.md ]]; then
              continue
            fi
            code=true
            break
          done < "$RUNNER_TEMP/changed-paths"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  worker:
    name: Worker (typecheck + test)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Wrangler 4.87+ npm bin wrapper requires Node 22; this job is Node 22.
      - run: npx wrangler --version
      - run: npm run types:check
      - run: npm run typecheck
      - run: npm test

  ops-node20:
    name: Ops CLI (Node 20)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20.19.2"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --engine-strict=false
      # Wrangler 4.87+ advertises engines.node >=22; ops launches
      # wrangler-dist/cli.js on Node 20.19.x instead of the bin wrapper.
      - run: npm run ops -- --help
      - run: npm run ops -- deploy worker --help
      - run: npx vitest run --project node test/unit/lib/wrangler-cli.test.ts
      # The npm bin wrapper must keep refusing Node 20; ops uses wrangler-dist.
      - name: Wrangler npm wrapper refuses Node 20
        run: |
          set +e
          output="$(node node_modules/wrangler/bin/wrangler.js --version 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          printf '%s\n' "$output" | grep -E 'Wrangler requires at least Node\.js v22|Please update your version of Node\.js'

  web:
    name: Web (test + build)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  app:
    name: App (typecheck + test + build + smoke)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      # @tanstack/react-start requires Node >=22.12 (ADR 0003).
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Includes the cross-environment service-binding check.
      - run: npm test
      - run: npm run build
      # Runs the built Worker: 404 for backend paths, cache headers, themed SSR.
      - run: npm run test:smoke

  app-browser:
    name: App (browser evidence)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Resolve the pinned Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browser-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: npx playwright install --with-deps chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
      # Chromium is cached, but its system libraries are not.
      - run: npx playwright install-deps chromium
        if: steps.browser-cache.outputs.cache-hit == 'true'
      # The suite serves the built Worker against the fixture-pack stub.
      - run: npm run build
      # Axe (WCAG 2.2 AA) and the keyboard pass fail the job; screenshots are
      # evidence for review, not pixel gates.
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            app/e2e/screenshots
            app/e2e/report
          retention-days: 14
          if-no-files-found: warn
