name: CI

on:
  # epic/postgres-storage is the storage migration's long-lived candidate
  # branch (ADR 0005): slice PRs into it and pushes to it run CI. The deploy
  # workflows stay filtered to main, so branch CI cannot deploy.
  pull_request:
    branches: [main, epic/postgres-storage]
  push:
    branches: [main, epic/postgres-storage]
    # No CI run means no workflow_run production deployment for these pushes.
    # Documentation pushes neither test nor deploy. docs/openapi.yaml is
    # checked by Worker tests, so scripts/ci-lib/changed-jobs.ts runs the
    # Worker job for it on PRs; a direct push of only that file is checked by
    # the next code change.
    # PRs must still emit the existing job checks so required checks do not
    # remain pending.
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.agents/**/*.md'
      - '.agents/**/*.yaml'
      - '.claude/**/*.md'
      - '.claude/skills/**'
      - '.beads/**'
      - '.claude/settings.json'
      - '.codex/**'
      - '.cursor/hooks.json'
      - '.cursor/rules/**'
      - 'LICENSE'
      - 'skills-lock.json'
  # A manual full run of any branch, for a PR while DISABLE_PR_CI is on:
  #   gh workflow run ci.yml --ref <branch>
  # Its check runs land on the branch head, so they show on the PR. It never
  # deploys: deploy-worker.yml releases only a successful `push` run on main.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Check for code changes
    # Toggle PR checks with the DISABLE_PR_CI repository variable; main always
    # runs, and so does a manual dispatch.
    if: github.event_name != 'pull_request' || vars.DISABLE_PR_CI != 'true'
    runs-on: ubuntu-latest
    outputs:
      worker: ${{ steps.changes.outputs.worker }}
      app: ${{ steps.changes.outputs.app }}
      app-browser: ${{ steps.changes.outputs.appBrowser }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Node 22.18+ runs the TypeScript classifier without a build step.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Select jobs from changed paths
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          # A push to main already passed paths-ignore and deploys whatever
          # this run approves, so it runs every job rather than trusting an
          # earlier commit's result; a manual dispatch has no PR base to diff
          # against and runs every job too. A pull request runs only the jobs whose
          # suites read its changed paths (scripts/ci-lib/changed-jobs.ts),
          # diffed from the merge base, including deleted paths; disabling
          # rename detection also checks the old path.
          if [[ "$EVENT_NAME" != pull_request ]]; then
            printf '%s=true\n' worker app appBrowser >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --no-renames --name-only -z "$BASE_SHA...$HEAD_SHA" \
            | node scripts/ci-lib/changed-jobs.ts > "$RUNNER_TEMP/jobs"
          cat "$RUNNER_TEMP/jobs"
          # Empty outputs would skip every job and still pass required checks.
          test "$(grep -cE '^(worker|app|appBrowser)=(true|false)$' "$RUNNER_TEMP/jobs")" -eq 3 || {
            echo "classifier did not select all three jobs"
            exit 1
          }
          cat "$RUNNER_TEMP/jobs" >> "$GITHUB_OUTPUT"

  # Hosted, like the node pool below: after the trim (reading-lite-rs1m) the
  # Workers pool is four guard files, so neither job queues behind the others
  # on the single self-hosted runner.
  worker:
    name: Worker (typecheck + test)
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    # Matches Neon: PostgreSQL 18 with pgvector 0.8.x (ADR 0005). Tests never
    # connect to Neon. The workers pool reaches this through the HYPERDRIVE
    # binding's local connection string, which vitest.workspace.ts points at
    # TEST_DATABASE_URL; globalSetup creates and migrates the database.
    #
    # --init keeps the postmaster off PID 1. PostgreSQL 18 treats any unknown
    # child that exits non-zero as a crash and resets the server, and PID 1
    # inherits every process orphaned in the container: a health-check
    # pg_isready outliving its shell under test load exits 2 and drops every
    # connection mid-run (run 35812647300).
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg18
        env:
          POSTGRES_USER: reading_lite
          POSTGRES_PASSWORD: reading_lite
          POSTGRES_DB: reading_lite_test
        ports:
          - 5432:5432
        options: >-
          --init
          --health-cmd "pg_isready -U reading_lite -d reading_lite_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://reading_lite:reading_lite@127.0.0.1:5432/reading_lite_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Wrangler 4.87+ npm bin wrapper requires Node 22; this job is Node 22.
      - run: npx wrangler --version
      - run: npm run types:check
      - run: npm run typecheck
      - run: npm run test:workers:ci

  # The Node pool is three small guard files, so it runs on a hosted runner
  # rather than queueing on the single self-hosted one.
  # control-plane-guards needs PostgreSQL; globalSetup migrates this database.
  worker-node:
    name: Worker (node pool)
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg18
        env:
          POSTGRES_USER: reading_lite
          POSTGRES_PASSWORD: reading_lite
          POSTGRES_DB: reading_lite_test
        ports:
          - 5432:5432
        options: >-
          --init
          --health-cmd "pg_isready -U reading_lite -d reading_lite_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://reading_lite:reading_lite@127.0.0.1:5432/reading_lite_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test:node:ci

  app:
    name: App (typecheck + test + build + smoke)
    needs: changes
    # Skipped jobs satisfy required checks; each job runs only for the paths
    # its suite reads.
    if: needs.changes.outputs.app == 'true'
    # Hosted: after the trim (reading-lite-xido) the suite is a few seconds, so
    # it need not queue behind the Worker job on the self-hosted runner.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      # @tanstack/react-start requires Node >=22.12 (ADR 0003).
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # The frontend guards (test/guards.test.tsx).
      - run: npm test
      - run: npm run build
      # Runs the built Worker: 404 for backend paths, cache headers, sign-in
      # redirects, and two tenants' concurrent renders kept apart.
      - run: npm run test:smoke

  app-browser:
    name: App (browser evidence)
    needs: changes
    if: needs.changes.outputs.app-browser == 'true'
    # Hosted: `playwright install --with-deps` needs passwordless sudo for its
    # system packages, which the self-hosted runner does not have.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Resolve the pinned Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browser-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: npx playwright install --with-deps chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
      # Chromium is cached, but its system libraries are not.
      - run: npx playwright install-deps chromium
        if: steps.browser-cache.outputs.cache-hit == 'true'
      # The suite serves the built Worker against the fixture-pack stub.
      - run: npm run build
      # The essential scope (app/e2e/scope.ts): the covered routes in one light
      # and one dark project, plus onboarding. Axe (WCAG 2.2 AA) and the
      # keyboard pass fail the job; screenshots are evidence for review, not
      # pixel gates. `npm run test:browser` is the full matrix, for local
      # verification.
      - run: npm run test:browser:ci
      # The report already attaches every screenshot, so upload it alone; the
      # e2e/screenshots copy would double the artifact. Three days covers a
      # review: at 14 the artifacts outgrew the account's Actions storage.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: app/e2e/report
          retention-days: 3
          if-no-files-found: warn
