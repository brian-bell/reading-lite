name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # No CI run means no workflow_run production deployment for these pushes.
    # Keep this list to paths that scripts/ci-lib/changed-jobs.ts selects no
    # jobs for. PRs must still emit the existing job checks so required checks
    # do not remain pending.
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.agents/**/*.md'
      - '.agents/**/*.yaml'
      - '.claude/**/*.md'
      - '.claude/skills/**'
      - '.beads/**'
      - 'LICENSE'
      - 'skills-lock.json'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Check for code changes
    # Toggle PR checks with the DISABLE_PR_CI repository variable; main always runs.
    if: github.event_name != 'pull_request' || vars.DISABLE_PR_CI != 'true'
    runs-on: ubuntu-latest
    outputs:
      worker: ${{ steps.changes.outputs.worker }}
      ops: ${{ steps.changes.outputs.ops }}
      web: ${{ steps.changes.outputs.web }}
      app: ${{ steps.changes.outputs.app }}
      app-browser: ${{ steps.changes.outputs.appBrowser }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Node 22.18+ runs the TypeScript classifier without a build step.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Select jobs from changed paths
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          # A push to main already passed paths-ignore and deploys whatever
          # this run approves, so it runs every job rather than trusting an
          # earlier commit's result. A pull request runs only the jobs whose
          # suites read its changed paths (scripts/ci-lib/changed-jobs.ts),
          # diffed from the merge base, including deleted paths; disabling
          # rename detection also checks the old path.
          if [[ "$EVENT_NAME" != pull_request ]]; then
            printf '%s=true\n' worker ops web app appBrowser >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --no-renames --name-only -z "$BASE_SHA...$HEAD_SHA" \
            | node scripts/ci-lib/changed-jobs.ts | tee -a "$GITHUB_OUTPUT"

  worker:
    name: Worker (typecheck + test)
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Wrangler 4.87+ npm bin wrapper requires Node 22; this job is Node 22.
      - run: npx wrangler --version
      - run: npm run types:check
      - run: npm run typecheck
      - run: npm test

  ops-node20:
    name: Ops CLI (Node 20)
    needs: changes
    if: needs.changes.outputs.ops == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20.19.2"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --engine-strict=false
      # Wrangler 4.87+ advertises engines.node >=22; ops launches
      # wrangler-dist/cli.js on Node 20.19.x instead of the bin wrapper.
      - run: npm run ops -- --help
      - run: npm run ops -- deploy worker --help
      - run: npx vitest run --project node test/unit/lib/wrangler-cli.test.ts
      # The npm bin wrapper must keep refusing Node 20; ops uses wrangler-dist.
      - name: Wrangler npm wrapper refuses Node 20
        run: |
          set +e
          output="$(node node_modules/wrangler/bin/wrangler.js --version 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          printf '%s\n' "$output" | grep -E 'Wrangler requires at least Node\.js v22|Please update your version of Node\.js'

  web:
    name: Web (test + build)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  app:
    name: App (typecheck + test + build + smoke)
    needs: changes
    # Skipped jobs satisfy required checks; each job runs only for the paths
    # its suite reads.
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      # @tanstack/react-start requires Node >=22.12 (ADR 0003).
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Includes the cross-environment service-binding check.
      - run: npm test
      - run: npm run build
      # Runs the built Worker: 404 for backend paths, cache headers, themed SSR.
      - run: npm run test:smoke

  app-browser:
    name: App (browser evidence)
    needs: changes
    if: needs.changes.outputs.app-browser == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Resolve the pinned Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browser-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: npx playwright install --with-deps chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
      # Chromium is cached, but its system libraries are not.
      - run: npx playwright install-deps chromium
        if: steps.browser-cache.outputs.cache-hit == 'true'
      # The suite serves the built Worker against the fixture-pack stub.
      - run: npm run build
      # The essential scope (app/e2e/scope.ts): the major states of each route
      # in one light and one dark project, plus the behaviour specs. Axe (WCAG
      # 2.2 AA) and the keyboard pass fail the job; screenshots are evidence
      # for review, not pixel gates. `npm run test:browser` is the full matrix,
      # for local verification.
      - run: npm run test:browser:ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            app/e2e/screenshots
            app/e2e/report
          retention-days: 14
          if-no-files-found: warn
