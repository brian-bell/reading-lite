# Deploy the production Worker after CI succeeds for a main commit. The exact CI
# SHA is checked out and recorded for the downstream SPA release. This workflow
# does not deploy the SPA, import the founder token, or pass --var. It does
# apply pending PostgreSQL migrations, immediately before the upload.

name: Deploy production worker

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://readinglite.ai
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Require deploy secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # One secret, two readers: the wipe gate counts unfinished wipes, and
          # the deploy applies pending migrations before the upload. Both reach
          # the production control plane, which is PostgreSQL now (ADR 0005),
          # over a direct connection string.
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "missing secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "missing secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$PRODUCTION_DATABASE_URL" || { echo "missing secret PRODUCTION_DATABASE_URL"; exit 1; }
      - name: Deploy production worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_WIPE_OVERRIDE_SHA: ${{ vars.DEPLOY_WIPE_OVERRIDE_SHA }}
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "${{ github.event.workflow_run.head_sha }}" || {
            echo "refusing stale Worker release: main advanced past ${{ github.event.workflow_run.head_sha }}"
            exit 1
          }
          npm run ops -- deploy wipe-check --release-sha "$RELEASE_SHA" --database-url-env PRODUCTION_DATABASE_URL
          npm run ops -- deploy worker --env production --database-url-env PRODUCTION_DATABASE_URL --execute
      - name: Record the released SHA
        run: |
          mkdir -p .release
          echo "${{ github.event.workflow_run.head_sha }}" > .release/sha
      - name: Publish the released SHA for the SPA workflow
        uses: actions/upload-artifact@v6
        with:
          name: production-worker-release-sha
          path: .release/sha
          if-no-files-found: error
          retention-days: 1
