# Deploy the production Worker after CI succeeds for a main commit. The exact CI
# SHA is checked out and recorded for the downstream frontend release. The deploy
# applies the pending PostgreSQL migrations before the upload, over the same
# direct connection string the wipe gate reads. This workflow does not deploy
# the frontend, create the database, import the founder token, or pass --var.

name: Deploy production worker

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://readinglite.ai
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Require deploy secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The wipe gate reads wipe_progress from the production control plane,
          # which is PostgreSQL now (ADR 0005), over a direct connection string.
          # `deploy worker` applies the pending migrations through the same
          # string, so the role behind it also needs DDL.
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "missing secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "missing secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$PRODUCTION_DATABASE_URL" || { echo "missing secret PRODUCTION_DATABASE_URL"; exit 1; }
      - name: Deploy production worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_WIPE_OVERRIDE_SHA: ${{ vars.DEPLOY_WIPE_OVERRIDE_SHA }}
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "${{ github.event.workflow_run.head_sha }}" || {
            echo "refusing stale Worker release: main advanced past ${{ github.event.workflow_run.head_sha }}"
            exit 1
          }
          npm run ops -- deploy wipe-check --release-sha "$RELEASE_SHA" --database-url-env PRODUCTION_DATABASE_URL
          npm run ops -- deploy worker --env production --execute --database-url-env PRODUCTION_DATABASE_URL
      - name: Record the released SHA
        run: |
          mkdir -p .release
          echo "${{ github.event.workflow_run.head_sha }}" > .release/sha
      - name: Publish the released SHA for the frontend workflow
        uses: actions/upload-artifact@v6
        with:
          name: production-worker-release-sha
          path: .release/sha
          if-no-files-found: error
          retention-days: 1
