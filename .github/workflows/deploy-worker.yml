# Deploy the production Worker on merge to main (and on workflow_dispatch).
# Same path as a local operator: ops deploy worker --env production --execute
# (pending remote D1 migrations, then wrangler deploy). Does not deploy the SPA,
# create the D1 database, import the founder token, or pass --var (cannot flip
# TENANT_DATA_PLANE). See docs/operations.md.

name: Deploy production worker

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  worker:
    name: Worker (typecheck + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    name: Deploy
    needs: worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://reading-lite.bbell.dev
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Require Cloudflare deploy secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "missing secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "missing secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Deploy production worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run ops -- deploy worker --env production --execute
