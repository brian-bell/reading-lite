# Deploy the new frontend Worker (app/) to its staging hosts:
# next-staging.readinglite.ai, and since the Phase 4 staging switch (#339,
# 2026-09-16) staging.readinglite.ai and staging.readinglite.app (ADR 0003,
# amended 2026-09-13). Manual only: the
# staging backend is deployed by hand (`npm run ops -- deploy worker --env
# staging --execute`), so run this after that, from the same ref.

name: Deploy staging frontend

on:
  workflow_dispatch:

concurrency:
  group: deploy-staging-app
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy frontend Worker (staging hosts)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # @tanstack/react-start requires Node >=22.12 (ADR 0003).
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci
      - name: Require Cloudflare deploy secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "missing secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "missing secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Build the staging frontend
        working-directory: app
        env:
          CLOUDFLARE_ENV: staging
        run: |
          npm run build
          # The built config is what deploys: check its environment, routes,
          # and BACKEND binding against wrangler.jsonc and the backend's.
          node scripts/check-build.ts staging
      - name: Deploy the staging frontend
        working-directory: app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Smoke-check route precedence on every staging host
        run: |
          app/scripts/smoke-host.sh https://next-staging.readinglite.ai
          app/scripts/smoke-host.sh https://staging.readinglite.ai
          app/scripts/smoke-host.sh https://staging.readinglite.app
