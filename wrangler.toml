# reading-lite — Cloudflare Worker
#
# Three environments:
#   * default (dev)     — used by `wrangler dev` for local testing only
#                         (never deployed; the distinct dev worker name guards
#                         against an accidental bare `wrangler deploy` clobbering
#                         prod). Binds to a local Miniflare-emulated R2 bucket;
#                         no remote resources are touched.
#   * staging           — deployed Cloudflare resources isolated from prod,
#                         used for end-to-end manual smoke tests that need Queue
#                         and R2.
#   * production        — used by `npm run ops -- deploy worker --env production`,
#                         canonical host readinglite.ai; also readinglite.app.
#                         reading-lite.bbell.dev is retired (S9).
#
# Local dev:
#   1. Copy `.dev.vars.example` → `.dev.vars` and fill in API keys.
#   2. `npm run dev` (sets up local PostgreSQL and founder bootstrap, then starts wrangler).
# Note: `wrangler dev` runs against a local emulated R2 bucket (initially empty)
# and local PostgreSQL; `npm run seed:local` fills both with the fixture pack. POST
# /api/readings and /api/readings/:id/reprocess also fail under `wrangler dev` (no queue
# binding). Read-only list/detail routes work against whatever you write locally.
# Most submission/search behavior is covered by the integration tests instead.
#
# Staging setup (one-time):
#   `npx wrangler r2 bucket create reading-lite-staging`
#   `npx wrangler queues create reading-lite-staging`
#   `npx wrangler queues create reading-lite-staging-dlq`  (dead-letter queue; not auto-created)
#   `npx wrangler queues create reading-lite-staging-digest`
#   `npx wrangler queues create reading-lite-staging-digest-dlq`
#   `npx wrangler queues create reading-lite-staging-wipe`
#   `npx wrangler queues create reading-lite-staging-wipe-dlq`
#   `npx wrangler queues create reading-lite-staging-export`
#   `npx wrangler queues create reading-lite-staging-export-dlq`
#   `npx wrangler queues create reading-lite-staging-refresh`
#   `npx wrangler queues create reading-lite-staging-refresh-dlq`
#   `wrangler secret put READER_API_TOKEN --env staging`
#   `wrangler secret put OPENAI_API_KEY --env staging`
#   `wrangler secret put X_API_BEARER_TOKEN --env staging`  (for X status URLs)
#   `wrangler secret put ANTHROPIC_API_KEY --env staging`  (only for SUMMARIZER_PROVIDER=anthropic)
#   `wrangler secret put TURNSTILE_SECRET_KEY --env staging`  (required before open-mode signup)
#
# Production setup (one-time):
#   `npx wrangler r2 bucket create reading-lite`
#   `npx wrangler queues create reading-lite`
#   `npx wrangler queues create reading-lite-dlq`  (dead-letter queue; not auto-created)
#   `npx wrangler queues create reading-lite-digest`
#   `npx wrangler queues create reading-lite-digest-dlq`
#   `npx wrangler queues create reading-lite-wipe`
#   `npx wrangler queues create reading-lite-wipe-dlq`
#   `npx wrangler queues create reading-lite-export`
#   `npx wrangler queues create reading-lite-export-dlq`
#   `npx wrangler queues create reading-lite-refresh`
#   `npx wrangler queues create reading-lite-refresh-dlq`
#   `wrangler secret put READER_API_TOKEN --env production`
#   `wrangler secret put OPENAI_API_KEY --env production`
#   `wrangler secret put X_API_BEARER_TOKEN --env production`  (for X status URLs)
#   `wrangler secret put ANTHROPIC_API_KEY --env production`  (only for SUMMARIZER_PROVIDER=anthropic)
#   `wrangler secret put TURNSTILE_SECRET_KEY --env production`  (required before open-mode signup)

name = "reading-lite-dev"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AuthRateGuard"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["TenantUsageGuard"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["GlobalUsageGuard"]

[[durable_objects.bindings]]
name = "AUTH_RATE_GUARD"
class_name = "AuthRateGuard"

[[durable_objects.bindings]]
name = "TENANT_USAGE_GUARD"
class_name = "TenantUsageGuard"

[[durable_objects.bindings]]
name = "GLOBAL_USAGE_GUARD"
class_name = "GlobalUsageGuard"

# Production secrets (set via `wrangler secret put` per-env, e.g.
# `wrangler secret put READER_API_TOKEN --env production`):
#   READER_API_TOKEN     — imported once into PostgreSQL as the founder's legacy bearer
#   AUTH_ROOT_SECRET     — 256-bit hex HKDF root for credential HMACs
#   PROVIDER_KEY_SECRET  — 256-bit hex HKDF root for tenant provider keys
#                          (AES-256-GCM). Unset until a tenant key is stored.
#                          PROVIDER_KEY_PREVIOUS_SECRET is the previous root
#                          during a rotation window. PROVIDER_KEY_VERSION and
#                          PROVIDER_KEY_PREVIOUS_VERSION default to 1.
#   OPENAI_API_KEY       — always required: embeddings + default summarizer
#   X_API_BEARER_TOKEN    — required only for X/Twitter status URL imports
#   ANTHROPIC_API_KEY    — required only for SUMMARIZER_PROVIDER=anthropic
#   RESEND_API_KEY       — required on staging/production for auth magic-link
#                          mail (also used for per-reading notifications)
#   TURNSTILE_SECRET_KEY — Cloudflare Turnstile siteverify secret (never in
#                          [vars]). Local open-mode skip/fail-open when unset;
#                          staging/production fail-closed (treat as no-send
#                          `{ok:true}` if missing, siteverify errors, or
#                          success≠true). Required to send mail in open mode.

[vars]
# Comma-separated list of origins allowed by CORS. Empty disables CORS preflight.
APP_ENV = "local"
CORS_ALLOWED_ORIGINS = ""
MCP_ALLOWED_ORIGINS = "https://reading-lite.bbell.dev"
PENDING_TTL_SECONDS = "900"
FETCH_TIMEOUT_MS = "20000"
FETCH_MAX_BYTES = "10485760"
ANTHROPIC_MODEL = "claude-sonnet-5-5"
SUMMARIZER_PROVIDER = "openai"
OPENAI_SUMMARIZATION_MODEL = "gpt-5.6-terra"
OPENAI_SUMMARIZATION_REASONING_EFFORT = "low"
ANTHROPIC_SUMMARIZATION_REASONING_EFFORT = "low"
EMAIL_FROM = ""
# Unused. Immediate notifications go to the verified account email.
EMAIL_TO = ""
WEB_BASE_URL = "http://127.0.0.1:5174"
# Public Turnstile widget site key. GET /api/auth/login-options returns it only
# when signup_mode is open. Omit until open-mode signup is enabled.
# Never put TURNSTILE_SECRET_KEY in [vars] — that is a wrangler secret.
# TURNSTILE_SITE_KEY = "1x00000000000000000000AA"
# Local-only magic-link outbox. Never set on staging or production.
LOCAL_MAIL_SINK = "1"
# Tenant-prefixed R2 keys (u/{tenantId}/…). Local stays unset: "1" would hide
# the global-rooted content a local bucket is seeded with. Staging and
# production both pin it under their own [vars] — staging since the deletion
# staging gate (issue #203 / #195 S6), production since the founder cutover
# (2026-08-31).
# TENANT_DATA_PLANE = "1"
# In-call retry for Anthropic / OpenAI 429s + 5xx. Honors Retry-After (clamped
# to RETRY_MAX_DELAY_MS); other transient failures use exponential backoff with
# full jitter starting from RETRY_BASE_DELAY_MS.
RETRY_MAX_ATTEMPTS = "3"
RETRY_BASE_DELAY_MS = "500"
RETRY_MAX_DELAY_MS = "8000"

# No `remote`, so `wrangler dev` binds to Miniflare's local R2 emulator
# (a local, initially-empty namespace) rather than any deployed bucket.
[[r2_buckets]]
binding = "READINGS_BUCKET"
bucket_name = "reading-lite"

# PostgreSQL through Hyperdrive (ADR 0005). Locally Hyperdrive is a passthrough
# to the docker-compose `postgres` service (`npm run dev` starts and migrates
# it). Reading state, embeddings and the control plane live here; R2 holds
# captured content. `ops deploy worker` refuses an environment whose
# POSTGRES_CUTOVER_ENABLED entry is false, or whose Hyperdrive id is still a
# placeholder (scripts/ops-lib/postgres-cutover.ts).
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "00000000000000000000000000000001"
localConnectionString = "postgres://reading_lite:reading_lite@127.0.0.1:54329/reading_lite"

# ---- staging ----
# Deploy with `npm run ops -- deploy worker --env staging --execute`.
# Environments do NOT inherit top-level [vars] / bindings — repeat them here.

[env.staging]
name = "reading-lite-staging"
workers_dev = true

# Requires Workers Paid. Pin the documented queue CPU default instead of
# relying on account defaults; Standard usage_model alone does not mean Paid.
[env.staging.limits]
cpu_ms = 30_000

# Retain cron, queue, and application logs for diagnosis after live tails disconnect.
[env.staging.observability]
enabled = true
head_sampling_rate = 1
# Lookup URLs and searches must not be retained in invocation logs.
redact_query_string = true

[env.staging.observability.logs]
enabled = true
invocation_logs = true

[env.staging.vars]
# Staging rollout: two connection judgements and two tension pairs per night.
RELATIONSHIP_REFRESH = "1"
REFRESH_MAX_JUDGEMENTS = "2"
REFRESH_MAX_TENSION_JUDGEMENTS = "2"
# Usage guards reuse a tenant's limits row for this long instead of opening a
# PostgreSQL client on every RPC. Only operator-set numbers are cached; the
# deletion fence and the paid-work switch are read fresh every time.
GUARD_POLICY_CACHE_MS = "5000"
APP_ENV = "staging"
CORS_ALLOWED_ORIGINS = ""
MCP_ALLOWED_ORIGINS = "https://staging.readinglite.ai,https://staging.readinglite.app"
PENDING_TTL_SECONDS = "900"
FETCH_TIMEOUT_MS = "20000"
FETCH_MAX_BYTES = "10485760"
ANTHROPIC_MODEL = "claude-sonnet-5-5"
SUMMARIZER_PROVIDER = "anthropic"
OPENAI_SUMMARIZATION_MODEL = "gpt-5.6-terra"
OPENAI_SUMMARIZATION_REASONING_EFFORT = "high"
ANTHROPIC_SUMMARIZATION_REASONING_EFFORT = "medium"
EMAIL_FROM = "RL Staging <noreply@staging.readinglite.app>"
# Unused. Immediate notifications go to the verified account email.
EMAIL_TO = ""
# Empty string = allowlist mode (FOUNDER_EMAIL if bound, plus this list).
AUTH_MAIL_ALLOWLIST = ""
WEB_BASE_URL = "https://staging.readinglite.ai/"
# Public Turnstile site key. Returned by GET /api/auth/login-options only when
# signup_mode is open. Staging bootstrap stays invite_only — leave unset until
# an explicit open-mode policy change. TURNSTILE_SECRET_KEY is a secret, not a var.
# TURNSTILE_SITE_KEY = ""
# Tenant-rooted R2 keys (u/{tenantId}/), matching
# production. Pinned so staging can exercise the destructive account-wipe path
# at all: `src/account-wipe.ts` skips with `no_tenant_prefix` whenever the gate
# is off, so a staging environment with this unset cannot rehearse deletion —
# which is what issue #203 asks it to be able to do.
#
# Staging's one-time pre-tenant migration is complete: objects were copied
# under the founder tenant before this was pinned. The migration
# command is retired; retain this pin and the tenant-activation deploy guard.
# The retained pre-tenant readings/ and index/ objects stay in the bucket.
# Removing this line and redeploying is a complete
# rollback ONLY before post-pin writes resume. After the pin, new staging
# readings keep their content only under tenant R2 roots; rolling the gate
# back without a freeze plus reverse reconciliation (copy those objects back to
# the global layout) makes post-pin writes disappear
# from the app even though their bytes still exist. After writes, require that
# freeze + reverse reconciliation, or an explicit captain-accepted loss of the
# post-pin corpus. See docs/operations.md, "Rehearsing account deletion on
# staging".
#
# Turning this on also arms the wipe: fan-out stops short-circuiting, so check
# for accounts already left in status='deleting' before deploying.
TENANT_DATA_PLANE = "1"
RETRY_MAX_ATTEMPTS = "3"
RETRY_BASE_DELAY_MS = "500"
RETRY_MAX_DELAY_MS = "8000"

[[env.staging.queues.producers]]
binding = "READING_JOBS"
queue = "reading-lite-staging"

[[env.staging.queues.consumers]]
queue = "reading-lite-staging"
max_batch_size = 1
max_batch_timeout = 5
max_concurrency = 3
max_retries = 3
dead_letter_queue = "reading-lite-staging-dlq"

[[env.staging.queues.consumers]]
queue = "reading-lite-staging-dlq"
max_batch_size = 10
max_batch_timeout = 5
max_concurrency = 1
max_retries = 3

[[env.staging.queues.producers]]
binding = "DIGEST_JOBS"
queue = "reading-lite-staging-digest"

[[env.staging.queues.consumers]]
queue = "reading-lite-staging-digest"
max_batch_size = 1
max_batch_timeout = 5
max_concurrency = 3
max_retries = 3
dead_letter_queue = "reading-lite-staging-digest-dlq"

[[env.staging.queues.consumers]]
queue = "reading-lite-staging-digest-dlq"
max_batch_size = 10
max_batch_timeout = 5
max_concurrency = 1
max_retries = 3

# Shared tenant wipe (issue 195b PR1). One queue for every tenant — not a
# per-tenant Worker or queue. Continuation cursors live in R2, not the payload.
[[env.staging.queues.producers]]
binding = "ACCOUNT_WIPE_JOBS"
queue = "reading-lite-staging-wipe"

[[env.staging.queues.consumers]]
queue = "reading-lite-staging-wipe"
max_batch_size = 1
max_batch_timeout = 5
# One wipe job at a time, matching the digest consumer: throughput is one job
# per deleted account, and a single writer removes the sibling window the
# progress CAS would otherwise only detect after the fact.
max_concurrency = 1
# Must stay STRICTLY ABOVE ACCOUNT_WIPE_PROBE_MAX_ATTEMPTS in src/account-wipe.ts
# (4), because the confirmation bound is spent inside one message's own retry
# budget and not every retry spends an attempt:
#
#   - A healthy wipe always burns one retry on the +120s first-confirmation
#     deferral, which deliberately does NOT count as an attempt (S6 defect D2).
#   - A transient PostgreSQL or R2 error retries without counting either.
#
# So `>=` would leave zero headroom: one deferral plus four attempts exactly
# exhausts a budget of 4, and such a wipe dead-letters before the bound trips —
# the loop the bound exists to avoid. Two spare retries cover the deferral and
# one blip. Keep max_retries above the wipe's attempt bound; no test pins it.
max_retries = 6
dead_letter_queue = "reading-lite-staging-wipe-dlq"

[[env.staging.queues.consumers]]
queue = "reading-lite-staging-wipe-dlq"
max_batch_size = 10
max_batch_timeout = 5
max_concurrency = 1
max_retries = 3

# Archive export (reading-lite-mxwx). One shared queue for every tenant,
# separate from reading, digest, refresh, and wipe. The DLQ marks the export failed.
[[env.staging.queues.producers]]
binding = "ARCHIVE_EXPORT_JOBS"
queue = "reading-lite-staging-export"

[[env.staging.queues.consumers]]
queue = "reading-lite-staging-export"
max_batch_size = 1
max_batch_timeout = 5
max_concurrency = 1
max_retries = 3
dead_letter_queue = "reading-lite-staging-export-dlq"

[[env.staging.queues.consumers]]
queue = "reading-lite-staging-export-dlq"
max_batch_size = 10
max_batch_timeout = 5
max_concurrency = 1
max_retries = 3

# Nightly relationship refresh (#175), gated off in both environments.
[[env.staging.queues.producers]]
binding = "RELATIONSHIP_REFRESH_JOBS"
queue = "reading-lite-staging-refresh"

[[env.staging.queues.consumers]]
queue = "reading-lite-staging-refresh"
max_batch_size = 1
max_batch_timeout = 5
max_concurrency = 1
max_retries = 3
dead_letter_queue = "reading-lite-staging-refresh-dlq"

[[env.staging.queues.consumers]]
queue = "reading-lite-staging-refresh-dlq"
max_batch_size = 10
max_batch_timeout = 5
max_concurrency = 1
max_retries = 3

[env.staging.triggers]
crons = ["*/15 * * * *", "7 3 * * *"]

[[env.staging.r2_buckets]]
binding = "READINGS_BUCKET"
bucket_name = "reading-lite-staging"

# `reading-lite-staging`, created by #349 against the Neon rehearsal branch.
# Create every Hyperdrive config with query caching DISABLED: cached SELECTs
# would show stale lists after a write (ADR 0005).
[[env.staging.hyperdrive]]
binding = "HYPERDRIVE"
id = "42417083121547548bf2338106528349"

[[env.staging.durable_objects.bindings]]
name = "AUTH_RATE_GUARD"
class_name = "AuthRateGuard"

[[env.staging.durable_objects.bindings]]
name = "TENANT_USAGE_GUARD"
class_name = "TenantUsageGuard"

[[env.staging.durable_objects.bindings]]
name = "GLOBAL_USAGE_GUARD"
class_name = "GlobalUsageGuard"

# Worker routes scoped to API, health, and MCP. Since the Phase 4 staging
# switch (#339, 2026-09-16) the frontend Worker (app/wrangler.jsonc,
# reading-lite-app-staging) owns `/*` on both staging hosts. Staging dual-serves
# staging.readinglite.ai (canonical) and
# staging.readinglite.app. The reading-lite-staging.bbell.dev host is retired
# (S9); removing these blocks does not delete live Cloudflare routes.
# This file does not flip live DNS.
[[env.staging.routes]]
pattern = "staging.readinglite.ai/api/*"
zone_name = "readinglite.ai"

[[env.staging.routes]]
pattern = "staging.readinglite.ai/health"
zone_name = "readinglite.ai"

[[env.staging.routes]]
pattern = "staging.readinglite.ai/mcp*"
zone_name = "readinglite.ai"

[[env.staging.routes]]
pattern = "staging.readinglite.app/api/*"
zone_name = "readinglite.app"

[[env.staging.routes]]
pattern = "staging.readinglite.app/health"
zone_name = "readinglite.app"

[[env.staging.routes]]
pattern = "staging.readinglite.app/mcp*"
zone_name = "readinglite.app"

# ---- production ----
# Deploy with `npm run ops -- deploy worker --env production --execute`.
# Environments do NOT inherit top-level [vars] / bindings — repeat them here.

[env.production]
name = "reading-lite"

# Requires Workers Paid. Pin the documented queue CPU default instead of
# relying on account defaults; Standard usage_model alone does not mean Paid.
[env.production.limits]
cpu_ms = 30_000

# Retain cron, queue, and application logs for diagnosis after live tails disconnect.
[env.production.observability]
enabled = true
head_sampling_rate = 1
# Lookup URLs and searches must not be retained in invocation logs.
redact_query_string = true

[env.production.observability.logs]
enabled = true
invocation_logs = true

[env.production.vars]
# Enabled after the accepted 2026-09-08 staging nightly run.
RELATIONSHIP_REFRESH = "1"
REFRESH_MAX_JUDGEMENTS = "100"
REFRESH_MAX_TENSION_JUDGEMENTS = "100"
# See [env.staging.vars].
GUARD_POLICY_CACHE_MS = "5000"
APP_ENV = "production"
CORS_ALLOWED_ORIGINS = ""
MCP_ALLOWED_ORIGINS = "https://readinglite.ai,https://readinglite.app"
PENDING_TTL_SECONDS = "900"
FETCH_TIMEOUT_MS = "20000"
FETCH_MAX_BYTES = "10485760"
ANTHROPIC_MODEL = "claude-sonnet-5-5"
SUMMARIZER_PROVIDER = "anthropic"
OPENAI_SUMMARIZATION_MODEL = "gpt-5.6-terra"
OPENAI_SUMMARIZATION_REASONING_EFFORT = "high"
ANTHROPIC_SUMMARIZATION_REASONING_EFFORT = "medium"
# Set EMAIL_FROM (verified Resend domain) and WEB_BASE_URL via
# `wrangler deploy --var EMAIL_FROM:... --var WEB_BASE_URL:...`
# or by uncommenting and editing here before deploying.
# EMAIL_TO is unused; send-time recipient is users.email_display.
EMAIL_FROM = "Reading Lite <noreply@readinglite.app>"
EMAIL_TO = "bellbm@gmail.com"
# Domain cutover (issue #265, S4): emitted links point at readinglite.ai. Every
# queue-side link — digest, notification, MCP public_url — follows this base,
# and so does magic-link mail for a request whose host is not a recognised
# public origin. It is also one of the origins `isSameOriginRequest` accepts for
# cookie auth (src/middleware.ts), so this flip moves that allowance to the
# canonical public host too — harmless while the dual-served hosts are ours,
# and writes still need the CSRF HMAC. S8 (issue #265): sender is
# Reading Lite <noreply@readinglite.app> on the verified readinglite.app
# Resend domain. Rollback for the sender is reverting EMAIL_FROM to
# reading-lite@bbell.dev and deploying. Rollback for emitted links is putting
# a public host back on WEB_BASE_URL. The reading-lite.bbell.dev host is
# retired (S9); restoring it needs routes, Pages, and DNS, not this var.
WEB_BASE_URL = "https://readinglite.ai/"
# Public Turnstile site key. Returned by GET /api/auth/login-options only when
# signup_mode is open. Production bootstrap stays closed — leave unset until an
# explicit open-mode policy change. TURNSTILE_SECRET_KEY is a secret, not a var.
# TURNSTILE_SITE_KEY = ""
# Founder corpus cutover completed 2026-08-31 (docs/founder-cutover.md): every
# production R2 read/write is tenant-rooted (u/{tenantId}/ keys; PostgreSQL
# rows are scoped by tenant_id). Pinned here so ordinary deploys keep the gate on. Removing this
# line and deploying is a complete rollback only before post-pin writes resume;
# after writes, freeze + reverse reconciliation or captain-accepted loss.
# Legacy global (pre-tenant) objects are retained until a separate signed-off
# deletion.
TENANT_DATA_PLANE = "1"
RETRY_MAX_ATTEMPTS = "3"
RETRY_BASE_DELAY_MS = "500"
RETRY_MAX_DELAY_MS = "8000"

# Reading processing is enqueued via this binding; the consumer below pulls
# messages and runs processReading. max_concurrency caps how many readings (and
# thus Anthropic/OpenAI calls) run at once. Two things make >1 safe: 429s from
# upstream are surfaced as RateLimitedError → msg.retry({ delaySeconds }) so the
# wait happens on the queue side rather than burning a worker slot; and each
# terminal write is one PostgreSQL transaction under its reading's row lock
# (PgReadingWriter), so concurrent readings never contend on a shared index.
[[env.production.queues.producers]]
binding = "READING_JOBS"
queue = "reading-lite"

[[env.production.queues.consumers]]
queue = "reading-lite"
max_batch_size = 1
max_batch_timeout = 5
max_concurrency = 3
max_retries = 3
# Messages that exhaust max_retries (almost always an upstream that stayed
# rate-limited past the retry budget) route here instead of being dropped.
# Without this, the reading would stay stranded pending+running forever.
dead_letter_queue = "reading-lite-dlq"

# Consumer for the dead-letter queue, served by this same worker. The queue()
# handler branches on batch.queue and marks each dead-lettered reading as a
# retryable `failed` reading (handleDeadLetter / markDeadLettered) so the
# strand becomes a visible, re-submittable failure. handleDeadLetter always
# acks — even when the mark write fails (logged, then dropped) — so a message
# can never loop in the DLQ. A failed mark falls back to the TTL annotator,
# which eventually flips the stale pending entry. max_retries therefore almost
# never fires (the handler acks every message it sees); it only matters if the
# handler itself never completes — e.g. the worker is evicted mid-batch before
# acking — in which case the message redelivers. There is no dead_letter_queue
# here, so an exhausted message simply drops rather than looping.
[[env.production.queues.consumers]]
queue = "reading-lite-dlq"
max_batch_size = 10
max_batch_timeout = 5
max_concurrency = 1
max_retries = 3

# Digest jobs are a separate queue (never READING_JOBS). The digest DLQ marks
# the digest ledger failed and must not call markDeadLettered / touch readings.
[[env.production.queues.producers]]
binding = "DIGEST_JOBS"
queue = "reading-lite-digest"

[[env.production.queues.consumers]]
queue = "reading-lite-digest"
max_batch_size = 1
max_batch_timeout = 5
max_concurrency = 3
max_retries = 3
dead_letter_queue = "reading-lite-digest-dlq"

[[env.production.queues.consumers]]
queue = "reading-lite-digest-dlq"
max_batch_size = 10
max_batch_timeout = 5
max_concurrency = 1
max_retries = 3

# Shared tenant wipe (issue 195b PR1). One queue for every tenant — not a
# per-tenant Worker or queue. DELETE /api/account does not enqueue; cron does.
[[env.production.queues.producers]]
binding = "ACCOUNT_WIPE_JOBS"
queue = "reading-lite-wipe"

[[env.production.queues.consumers]]
queue = "reading-lite-wipe"
max_batch_size = 1
max_batch_timeout = 5
# One wipe job at a time, matching the digest consumer: throughput is one job
# per deleted account, and a single writer removes the sibling window the
# progress CAS would otherwise only detect after the fact.
max_concurrency = 1
# Must stay STRICTLY ABOVE ACCOUNT_WIPE_PROBE_MAX_ATTEMPTS in src/account-wipe.ts
# (4), because the confirmation bound is spent inside one message's own retry
# budget and not every retry spends an attempt:
#
#   - A healthy wipe always burns one retry on the +120s first-confirmation
#     deferral, which deliberately does NOT count as an attempt (S6 defect D2).
#   - A transient PostgreSQL or R2 error retries without counting either.
#
# So `>=` would leave zero headroom: one deferral plus four attempts exactly
# exhausts a budget of 4, and such a wipe dead-letters before the bound trips —
# the loop the bound exists to avoid. Two spare retries cover the deferral and
# one blip. Keep max_retries above the wipe's attempt bound; no test pins it.
max_retries = 6
dead_letter_queue = "reading-lite-wipe-dlq"

[[env.production.queues.consumers]]
queue = "reading-lite-wipe-dlq"
max_batch_size = 10
max_batch_timeout = 5
max_concurrency = 1
max_retries = 3

# Archive export (reading-lite-mxwx). One shared queue for every tenant,
# separate from reading, digest, refresh, and wipe. The DLQ marks the export failed.
[[env.production.queues.producers]]
binding = "ARCHIVE_EXPORT_JOBS"
queue = "reading-lite-export"

[[env.production.queues.consumers]]
queue = "reading-lite-export"
max_batch_size = 1
max_batch_timeout = 5
max_concurrency = 1
max_retries = 3
dead_letter_queue = "reading-lite-export-dlq"

[[env.production.queues.consumers]]
queue = "reading-lite-export-dlq"
max_batch_size = 10
max_batch_timeout = 5
max_concurrency = 1
max_retries = 3

# Nightly relationship refresh (#175), gated off in both environments.
[[env.production.queues.producers]]
binding = "RELATIONSHIP_REFRESH_JOBS"
queue = "reading-lite-refresh"

[[env.production.queues.consumers]]
queue = "reading-lite-refresh"
max_batch_size = 1
max_batch_timeout = 5
max_concurrency = 1
max_retries = 3
dead_letter_queue = "reading-lite-refresh-dlq"

[[env.production.queues.consumers]]
queue = "reading-lite-refresh-dlq"
max_batch_size = 10
max_batch_timeout = 5
max_concurrency = 1
max_retries = 3

[env.production.triggers]
crons = ["*/15 * * * *", "7 3 * * *"]

[[env.production.r2_buckets]]
binding = "READINGS_BUCKET"
bucket_name = "reading-lite"

# Hyperdrive config reading-lite-production (#350): the direct endpoint of the
# Neon main branch, with query caching DISABLED (ADR 0005).
[[env.production.hyperdrive]]
binding = "HYPERDRIVE"
id = "4aebdf8836c746f29703a04cf575b34a"

[[env.production.durable_objects.bindings]]
name = "AUTH_RATE_GUARD"
class_name = "AuthRateGuard"

[[env.production.durable_objects.bindings]]
name = "TENANT_USAGE_GUARD"
class_name = "TenantUsageGuard"

[[env.production.durable_objects.bindings]]
name = "GLOBAL_USAGE_GUARD"
class_name = "GlobalUsageGuard"

# Worker routes scoped to API, health, and MCP. Since the Phase 5 apex cutover
# (reading-lite-gh340.4) the frontend Worker (app/wrangler.jsonc,
# reading-lite-app) owns every other path with `host/*`; these more specific
# routes win over it.
#
# Production dual-serves the two public hosts on the same Worker script, bucket
# and database. The data plane does not branch on hostname, so /api/*
# and /health behave the same on either. /mcp* accepts both
# (MCP_ALLOWED_ORIGINS above lists them), and WEB_BASE_URL names
# readinglite.ai, so emitted links point there. Sessions remain host-scoped
# (the session cookie carries no Domain attribute), so signing in on one host
# does not sign you in on another; see the "readinglite.ai / readinglite.app
# dual-serve" section of docs/operations.md. The reading-lite.bbell.dev host
# is retired (S9); removing those blocks does not delete live Cloudflare
# routes. `www.readinglite.ai` and `www.readinglite.app` get no Worker route:
# `www` -> apex belongs to a Cloudflare redirect rule (captain-only), which
# fires before the Worker is ever reached. Deploying these routes needs
# CLOUDFLARE_API_TOKEN scoped for Workers Routes on the readinglite.ai and
# readinglite.app zones (see docs/operations.md). This file does not flip
# live DNS.
[[env.production.routes]]
pattern = "readinglite.ai/api/*"
zone_name = "readinglite.ai"

[[env.production.routes]]
pattern = "readinglite.ai/health"
zone_name = "readinglite.ai"

[[env.production.routes]]
pattern = "readinglite.ai/mcp*"
zone_name = "readinglite.ai"

[[env.production.routes]]
pattern = "readinglite.app/api/*"
zone_name = "readinglite.app"

[[env.production.routes]]
pattern = "readinglite.app/health"
zone_name = "readinglite.app"

[[env.production.routes]]
pattern = "readinglite.app/mcp*"
zone_name = "readinglite.app"
