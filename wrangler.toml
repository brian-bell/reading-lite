# reading-lite — Cloudflare Worker
#
# Three environments:
#   * default (dev)     — used by `wrangler dev` for local testing only
#                         (never deployed; the distinct dev worker name guards
#                         against an accidental bare `wrangler deploy` clobbering
#                         prod). Binds to a local Miniflare-emulated R2 bucket;
#                         no remote resources are touched.
#   * staging           — deployed Cloudflare resources isolated from prod,
#                         used for end-to-end manual smoke tests that need Queue,
#                         R2, and Vectorize.
#   * production        — used by `npm run deploy` / `make deploy-worker ENV=prd`,
#                         served at reading-lite.bbell.dev.
#
# Local dev:
#   1. Copy `.dev.vars.example` → `.dev.vars` and fill in API keys.
#   2. `npm run dev` (applies local D1 migrations and founder bootstrap, then starts wrangler).
# Note: `wrangler dev` runs against a local emulated R2 bucket (initially empty)
# and has no Vectorize binding, so search returns no results locally. POST
# /api/readings and /api/readings/:id/reprocess also fail under `wrangler dev` (no queue
# binding). Read-only list/detail routes work against whatever you write locally.
# Most submission/search behavior is covered by the integration tests instead.
#
# Staging setup (one-time):
#   `npx wrangler r2 bucket create reading-lite-staging`
#   `npx wrangler vectorize create reading-lite-staging --dimensions=1536 --metric=cosine`
#   `npx wrangler queues create reading-lite-staging`
#   `npx wrangler queues create reading-lite-staging-dlq`  (dead-letter queue; not auto-created)
#   `wrangler secret put READER_API_TOKEN --env staging`
#   `wrangler secret put OPENAI_API_KEY --env staging`
#   `wrangler secret put ANTHROPIC_API_KEY --env staging`  (only for SUMMARIZER_PROVIDER=anthropic)
#
# Production setup (one-time):
#   `npx wrangler r2 bucket create reading-lite`
#   `npx wrangler vectorize create reading-lite --dimensions=1536 --metric=cosine`
#   `npx wrangler queues create reading-lite`
#   `npx wrangler queues create reading-lite-dlq`  (dead-letter queue; not auto-created)
#   `wrangler secret put READER_API_TOKEN --env production`
#   `wrangler secret put OPENAI_API_KEY --env production`
#   `wrangler secret put ANTHROPIC_API_KEY --env production`  (only for SUMMARIZER_PROVIDER=anthropic)

name = "reading-lite-dev"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

# Production secrets (set via `wrangler secret put` per-env, e.g.
# `wrangler secret put READER_API_TOKEN --env production`):
#   READER_API_TOKEN     — imported once as the founder legacy D1 token
#   AUTH_ROOT_SECRET     — 256-bit hex HKDF root for credential HMACs
#   OPENAI_API_KEY       — always required: embeddings + default summarizer
#   ANTHROPIC_API_KEY    — required only for SUMMARIZER_PROVIDER=anthropic
#   RESEND_API_KEY       — Resend API key (per-reading email notifications)

[vars]
# Comma-separated list of origins allowed by CORS. Empty disables CORS preflight.
CORS_ALLOWED_ORIGINS = ""
PENDING_TTL_SECONDS = "900"
FETCH_TIMEOUT_MS = "20000"
FETCH_MAX_BYTES = "10485760"
ANTHROPIC_MODEL = "claude-sonnet-4-6"
SUMMARIZER_PROVIDER = "openai"
OPENAI_SUMMARIZATION_MODEL = "gpt-5.6-terra"
OPENAI_SUMMARIZATION_REASONING_EFFORT = "low"
EMAIL_FROM = ""
EMAIL_TO = ""
WEB_BASE_URL = ""
# In-call retry for Anthropic / OpenAI 429s + 5xx. Honors Retry-After (clamped
# to RETRY_MAX_DELAY_MS); other transient failures use exponential backoff with
# full jitter starting from RETRY_BASE_DELAY_MS.
RETRY_MAX_ATTEMPTS = "3"
RETRY_BASE_DELAY_MS = "500"
RETRY_MAX_DELAY_MS = "8000"

# No `remote`, so `wrangler dev` binds to Miniflare's local R2 emulator
# (a local, initially-empty namespace) rather than any deployed bucket. There is
# deliberately no Vectorize binding here: Vectorize has no local emulator, and a
# remote binding would point dev at production data. Search therefore returns no
# results under `wrangler dev`; exercise it against the deployed worker instead.
[[r2_buckets]]
binding = "READINGS_BUCKET"
bucket_name = "reading-lite"

[[d1_databases]]
binding = "CONTROL_PLANE"
database_name = "reading-lite-control-dev"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations"

# ---- staging ----
# Deploy with `npm run deploy -- --env staging --execute`.
# Environments do NOT inherit top-level [vars] / bindings — repeat them here.

[env.staging]
name = "reading-lite-staging"
workers_dev = true

[env.staging.vars]
CORS_ALLOWED_ORIGINS = ""
PENDING_TTL_SECONDS = "900"
FETCH_TIMEOUT_MS = "20000"
FETCH_MAX_BYTES = "10485760"
ANTHROPIC_MODEL = "claude-sonnet-4-6"
SUMMARIZER_PROVIDER = "openai"
OPENAI_SUMMARIZATION_MODEL = "gpt-5.6-terra"
OPENAI_SUMMARIZATION_REASONING_EFFORT = "low"
EMAIL_FROM = ""
EMAIL_TO = ""
WEB_BASE_URL = ""
RETRY_MAX_ATTEMPTS = "3"
RETRY_BASE_DELAY_MS = "500"
RETRY_MAX_DELAY_MS = "8000"

[[env.staging.queues.producers]]
binding = "READING_JOBS"
queue = "reading-lite-staging"

[[env.staging.queues.consumers]]
queue = "reading-lite-staging"
max_batch_size = 1
max_batch_timeout = 5
max_concurrency = 3
max_retries = 3
dead_letter_queue = "reading-lite-staging-dlq"

[[env.staging.queues.consumers]]
queue = "reading-lite-staging-dlq"
max_batch_size = 10
max_batch_timeout = 5
max_concurrency = 1
max_retries = 3

[[env.staging.r2_buckets]]
binding = "READINGS_BUCKET"
bucket_name = "reading-lite-staging"

[[env.staging.vectorize]]
binding = "READINGS_INDEX"
index_name = "reading-lite-staging"

# Replace database_id after `wrangler d1 create reading-lite-control-staging`.
[[env.staging.d1_databases]]
binding = "CONTROL_PLANE"
database_name = "reading-lite-control-staging"
database_id = "a29af3ca-280c-443e-9edd-7acec745698c"
migrations_dir = "migrations"

# ---- production ----
# Deploy with `npm run deploy -- --execute` (which passes --env production).
# Environments do NOT inherit top-level [vars] / bindings — repeat them here.

[env.production]
name = "reading-lite"

[env.production.vars]
CORS_ALLOWED_ORIGINS = ""
PENDING_TTL_SECONDS = "900"
FETCH_TIMEOUT_MS = "20000"
FETCH_MAX_BYTES = "10485760"
ANTHROPIC_MODEL = "claude-sonnet-4-6"
SUMMARIZER_PROVIDER = "openai"
OPENAI_SUMMARIZATION_MODEL = "gpt-5.6-terra"
OPENAI_SUMMARIZATION_REASONING_EFFORT = "medium"
# Set EMAIL_FROM (verified Resend domain), EMAIL_TO, and WEB_BASE_URL via
# `wrangler deploy --var EMAIL_FROM:... --var EMAIL_TO:... --var WEB_BASE_URL:...`
# or by uncommenting and editing here before deploying.
EMAIL_FROM = "reading-lite@bbell.dev"
EMAIL_TO = "bellbm@gmail.com"
WEB_BASE_URL = "https://reading-lite.bbell.dev/"
RETRY_MAX_ATTEMPTS = "3"
RETRY_BASE_DELAY_MS = "500"
RETRY_MAX_DELAY_MS = "8000"

# Reading processing is enqueued via this binding; the consumer below pulls
# messages and runs processReading. max_concurrency caps how many readings (and
# thus Anthropic/OpenAI calls) run at once. Two things make >1 safe: 429s from
# upstream are surfaced as RateLimitedError → msg.retry({ delaySeconds }) so the
# wait happens on the queue side rather than burning a worker slot; and the
# index/list.json read-modify-write is guarded by an R2 compare-and-set retry
# loop (ReadingStore.mutateListIndex), so concurrent terminal writes merge
# instead of clobbering each other (last-writer-wins).
[[env.production.queues.producers]]
binding = "READING_JOBS"
queue = "reading-lite"

[[env.production.queues.consumers]]
queue = "reading-lite"
max_batch_size = 1
max_batch_timeout = 5
max_concurrency = 3
max_retries = 3
# Messages that exhaust max_retries (almost always an upstream that stayed
# rate-limited past the retry budget) route here instead of being dropped.
# Without this, the manifest would stay stranded pending+running forever.
dead_letter_queue = "reading-lite-dlq"

# Consumer for the dead-letter queue, served by this same worker. The queue()
# handler branches on batch.queue and marks each dead-lettered reading as a
# retryable `failed` manifest (handleDeadLetter / markDeadLettered) so the
# strand becomes a visible, re-submittable failure. handleDeadLetter always
# acks — even when the mark write fails (logged, then dropped) — so a message
# can never loop in the DLQ. A failed mark falls back to the TTL annotator,
# which eventually flips the stale pending entry. max_retries therefore almost
# never fires (the handler acks every message it sees); it only matters if the
# handler itself never completes — e.g. the worker is evicted mid-batch before
# acking — in which case the message redelivers. There is no dead_letter_queue
# here, so an exhausted message simply drops rather than looping.
[[env.production.queues.consumers]]
queue = "reading-lite-dlq"
max_batch_size = 10
max_batch_timeout = 5
max_concurrency = 1
max_retries = 3

[[env.production.r2_buckets]]
binding = "READINGS_BUCKET"
bucket_name = "reading-lite"

[[env.production.vectorize]]
binding = "READINGS_INDEX"
index_name = "reading-lite"

[[env.production.d1_databases]]
binding = "CONTROL_PLANE"
database_name = "reading-lite-control"
database_id = "23c5298d-42b0-42fc-8a77-bef441ee712e"
migrations_dir = "migrations"

# Worker routes scoped to API paths only; Pages (attached to the same custom
# domain) serves the SPA at every other path. Worker routes win over Pages.
[[env.production.routes]]
pattern = "reading-lite.bbell.dev/api/*"
zone_name = "bbell.dev"

[[env.production.routes]]
pattern = "reading-lite.bbell.dev/health"
zone_name = "bbell.dev"
