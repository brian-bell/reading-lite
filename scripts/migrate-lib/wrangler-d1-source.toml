# Used only by `ops migrate export` (reading-lite-gh348) to read the legacy D1
# control plane with SELECTs. The candidate's own wrangler.toml no longer binds
# D1, so the ids are pinned here, copied from main's wrangler.toml: the export
# reads exactly the database the deployed Worker used, never one resolved by
# name. Retired with the legacy stores in reading-lite-gh351.
name = "reading-lite-migrate-source"
compatibility_date = "2025-01-24"

[[env.staging.d1_databases]]
binding = "CONTROL_PLANE"
database_name = "reading-lite-control-staging"
database_id = "a29af3ca-280c-443e-9edd-7acec745698c"

[[env.production.d1_databases]]
binding = "CONTROL_PLANE"
database_name = "reading-lite-control"
database_id = "23c5298d-42b0-42fc-8a77-bef441ee712e"
