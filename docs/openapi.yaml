    ManifestStatus:
      type: string
      enum: [pending, ready, failed]

    SourceType:
      type: string
      enum: [url, markdown]

    ContentStatus:
      type: string
      enum: [captured, raw_only, failed]

    NoveltyVerdict:
      type: string
      enum: [novel, familiar, duplicate]

    ProcessingAttemptTrigger:
      type: string
      enum: [submit, reprocess, import]

    ProcessingAttemptStatus:
      type: string
      enum: [running, succeeded, failed]

    ProcessingStage:
      type: string
      enum:
        - queued
        - fetch_source
        - prepare_markdown
        - write_raw
        - write_extracted
        - embed_source
        - query_similar
        - summarize
        - embed_summary
        - upsert_vector
        - write_manifest
        - write_indexes
        - send_email

    Sha256Hex:
      type: string
      pattern: "^[0-9a-f]{64}$"
      description: 64 lowercase hex chars

    ManifestError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          minLength: 1
          description: >-
            The failing error's class. Provider account failures have their own
            codes, none retryable until the reader acts: `provider_key_required`
            (no active key), `provider_key_undecryptable` (the stored key will
            not open), `provider_key_invalid` (the provider answered 401 to the
            reader's key, which is now marked invalid), `provider_model_access`
            (a 403: the key is valid but cannot use the model), and
            `provider_insufficient_quota` (the provider's `insufficient_quota`
            429). The same 429 to the deployment's own key is
            `hosted_provider_quota`, the operator's to fix.
        message:
          type: string
          minLength: 1
        stage:
          $ref: "#/components/schemas/ProcessingStage"
        failed_at:
          type: string
          format: date-time
        retryable:
          type: boolean
        http_status:
          type: integer
          minimum: 100
          maximum: 599
          description: >-
            Status of the upstream HTTP response that failed, when the error
            class recorded one (for example a provider's 401 at `summarize`, or
            the source site's 403 at `fetch_source`). Provider messages are the
            provider's own text and do not repeat it.
        provider:
          type: string
          enum: [openai, anthropic]
          description: >-
            Whose account a provider key or account failure is about, set only
            with the `provider_*` and `hosted_provider_quota` codes. With
            Anthropic selected, a missing Anthropic key fails `summarize` with
            `provider_key_required` and `provider: anthropic` while the OpenAI
            key keeps paying for embeddings.

    ProcessingAttemptSummary:
      type: object
      additionalProperties: false
      required: [id, trigger, status, started_at]
      properties:
        id:
          type: string
          minLength: 1
        trigger:
          $ref: "#/components/schemas/ProcessingAttemptTrigger"
        status:
          $ref: "#/components/schemas/ProcessingAttemptStatus"
        stage:
          $ref: "#/components/schemas/ProcessingStage"
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        error:
          $ref: "#/components/schemas/ManifestError"

    ProcessingAttemptEvent:
      type: object
      additionalProperties: false
      required: [stage, status, at]
      properties:
        stage:
          $ref: "#/components/schemas/ProcessingStage"
        status:
          type: string
          enum: [started, succeeded, failed]
        at:
          type: string
          format: date-time
        duration_ms:
          type: number
          minimum: 0
        error:
          $ref: "#/components/schemas/ManifestError"

    ProcessingAttempt:
      type: object
      additionalProperties: false
      required:
        - id
        - trigger
        - status
        - started_at
        - reading_id
        - url
        - url_hash
        - key_prefix
        - events
      properties:
        id:
          type: string
          minLength: 1
        trigger:
          $ref: "#/components/schemas/ProcessingAttemptTrigger"
        status:
          $ref: "#/components/schemas/ProcessingAttemptStatus"
        stage:
          $ref: "#/components/schemas/ProcessingStage"
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        error:
          $ref: "#/components/schemas/ManifestError"
        reading_id:
          type: string
          minLength: 1
        url:
          type: string
          format: uri
        url_hash:
          $ref: "#/components/schemas/Sha256Hex"
        key_prefix:
          type: string
          minLength: 1
        events:
          type: array
          items:
            $ref: "#/components/schemas/ProcessingAttemptEvent"

    SimilaritySnapshot:
      type: object
      additionalProperties: false
      required: [count, computed_at]
      properties:
        count:
          type: integer
          minimum: 0
        max:
          type: number
        mean:
          type: number
        computed_at:
          type: string
          format: date-time

    EnrichmentDegradation:
      type: object
      additionalProperties: false
      description: >-
        Present on a ready YouTube reading that landed the oEmbed floor after
        a swallowed watch-page or transcript miss. Absent after a later full
        enrichment.
      required: [source, tier, code, message]
      properties:
        source:
          type: string
          enum: [youtube]
        tier:
          type: string
          enum: [watch_page, transcript]
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1

    Connection:
      type: object
      additionalProperties: false
      required: [id, reason]
      properties:
        id:
          type: string
          minLength: 1
        reason:
          type: string
          minLength: 1

    TensionKind:
      type: string
      description: >-
        Directional relationship from this reading's point of view.
        `supersedes` means this reading supersedes `id`; `superseded_by` means
        `id` supersedes this reading; likewise `qualifies` / `qualified_by`.
        `contradicts` is symmetric.
      enum: [contradicts, supersedes, superseded_by, qualifies, qualified_by]

    Tension:
      type: object
      additionalProperties: false
      required: [id, kind, reason, computed_at]
      properties:
        id:
          type: string
          minLength: 1
        kind:
          $ref: "#/components/schemas/TensionKind"
        reason:
          type: string
          minLength: 1
        computed_at:
          type: string
          format: date-time

    TensionJudged:
      type: object
      additionalProperties: false
      required: [id, judged_at]
      properties:
        id:
          type: string
          minLength: 1
        judged_at:
          type: string
          format: date-time

    OpenAISummarizationUsage:
      type: object
      additionalProperties: false
      required:
        - provider
        - model
        - input_tokens
        - output_tokens
        - reasoning_tokens
        - cached_input_tokens
        - cache_write_tokens
      properties:
        provider:
          type: string
          const: openai
        model:
          type: string
          minLength: 1
        input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0
        reasoning_tokens:
          type: integer
          minimum: 0
        cached_input_tokens:
          type: integer
          minimum: 0
        cache_write_tokens:
          type: integer
          minimum: 0

    AnthropicSummarizationUsage:
      type: object
      additionalProperties: false
      required:
        - provider
        - model
        - input_tokens
        - output_tokens
        - cache_creation_input_tokens
        - cache_read_input_tokens
      properties:
        provider:
          type: string
          const: anthropic
        model:
          type: string
          minLength: 1
        input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0
        cache_creation_input_tokens:
          type: integer
          minimum: 0
        cache_read_input_tokens:
          type: integer
          minimum: 0

    SummarizationUsage:
      oneOf:
        - $ref: "#/components/schemas/OpenAISummarizationUsage"
        - $ref: "#/components/schemas/AnthropicSummarizationUsage"
      discriminator:
        propertyName: provider
        mapping:
          openai: "#/components/schemas/OpenAISummarizationUsage"
          anthropic: "#/components/schemas/AnthropicSummarizationUsage"

    LegacyUsage:
      type: object
      additionalProperties: false
      required:
        - anthropic_input_tokens
        - anthropic_output_tokens
        - openai_embedding_tokens
      properties:
        anthropic_input_tokens:
          type: integer
          minimum: 0
        anthropic_output_tokens:
          type: integer
          minimum: 0
        openai_embedding_tokens:
          type: integer
          minimum: 0

    UsageV2:
      type: object
      additionalProperties: false
      required: [summarization, openai_embedding_tokens]
      properties:
        summarization:
          $ref: "#/components/schemas/SummarizationUsage"
        openai_embedding_tokens:
          type: integer
          minimum: 0

    Usage:
      oneOf:
        - $ref: "#/components/schemas/LegacyUsage"
        - $ref: "#/components/schemas/UsageV2"

    Manifest:
      description: |
        Stored reading manifest. The field set lives in ManifestFields so
        ReadingDetail can extend it; both stay closed to unknown properties.
      allOf:
        - $ref: "#/components/schemas/ManifestFields"
      unevaluatedProperties: false

    ReadingDetail:
      description: |
        GET /api/readings/{id} body: the manifest plus response-only
        relationship_targets, computed at read time from the same tenant's
        reading rows, and desk_position for a reading on the desk. Neither is
        stored on the manifest.
      allOf:
        - $ref: "#/components/schemas/ManifestFields"
        - type: object
          required:
            - relationship_targets
          properties:
            desk_position:
              $ref: "#/components/schemas/DeskPosition"
            relationship_targets:
              type: object
              description: |
                Connection and tension target ids mapped to their current list
                row. An id absent from the map is removed or unavailable.
              additionalProperties:
                $ref: "#/components/schemas/RelationshipTarget"
      unevaluatedProperties: false

    RelationshipTarget:
      type: object
      additionalProperties: false
      required:
        - url
        - status
        - created_at
      properties:
        url:
          type: string
          format: uri
        title:
          type: string
          minLength: 1
        status:
          $ref: "#/components/schemas/ManifestStatus"
        created_at:
          type: string
          format: date-time

    ManifestFields:
      type: object
      required:
        - id
        - url
        - url_hash
        - status
        - content_type
        - content_status
        - content_bytes
        - content_sha256
        - created_at
        - updated_at
      properties:
        id:
          type: string
          minLength: 1
        url:
          type: string
          format: uri
        url_hash:
          $ref: "#/components/schemas/Sha256Hex"
        source_type:
          $ref: "#/components/schemas/SourceType"
        status:
          $ref: "#/components/schemas/ManifestStatus"
        error:
          $ref: "#/components/schemas/ManifestError"
        active_attempt:
          $ref: "#/components/schemas/ProcessingAttemptSummary"
        last_attempt:
          $ref: "#/components/schemas/ProcessingAttemptSummary"
        preserve_ready_manifest:
          description: Internal rollback snapshot; opaque to clients
        title:
          type: string
          minLength: 1
        tldr:
          type: string
          minLength: 1
        tags:
          type: array
          items:
            type: string
        keywords:
          type: array
          items:
            type: string
        people:
          type: array
          items:
            type: string
        orgs:
          type: array
          items:
            type: string
        novelty_verdict:
          $ref: "#/components/schemas/NoveltyVerdict"
        similarity:
          $ref: "#/components/schemas/SimilaritySnapshot"
        connections:
          type: array
          items:
            $ref: "#/components/schemas/Connection"
        connections_computed_at:
          type: string
          format: date-time
          description: Time of the latest relationship-only judgement
        connections_neighbourhood_ids:
          type: array
          items:
            type: string
          description: Reading IDs considered by the latest relationship judgement (ingest or relationship-only refresh)
        tensions:
          type: array
          description: >-
            Directional tensions written by the offline tension refresh; never
            produced by ingest.
          items:
            $ref: "#/components/schemas/Tension"
        tensions_judged:
          type: array
          description: >-
            Pairwise tension judgements already made (including "none"
            verdicts) so a stable pair is not re-judged.
          items:
            $ref: "#/components/schemas/TensionJudged"
        summary_markdown:
          type: string
        content_type:
          type: string
          minLength: 1
        content_status:
          $ref: "#/components/schemas/ContentStatus"
        content_bytes:
          type: integer
          minimum: 0
        extracted_bytes:
          type: integer
          minimum: 0
        content_sha256:
          $ref: "#/components/schemas/Sha256Hex"
        enrichment_degradation:
          $ref: "#/components/schemas/EnrichmentDegradation"
        source_date:
          type: string
          format: date
          description: >
            Publication date of the source itself (YYYY-MM-DD), not when the
            reading was ingested. Absent on existing readings and when unknown.
        fetched_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        usage:
          $ref: "#/components/schemas/Usage"

    ListIndexItem:
      type: object
      additionalProperties: false
      required: [id, key_prefix, url, status, created_at]
      properties:
        id:
          type: string
          minLength: 1
        key_prefix:
          type: string
          minLength: 1
        url:
          type: string
          format: uri
        title:
          type: string
          minLength: 1
        tldr:
          type: string
          minLength: 1
        tags:
          type: array
          items:
            type: string
        keywords:
          type: array
          items:
            type: string
        status:
          $ref: "#/components/schemas/ManifestStatus"
        novelty_verdict:
          $ref: "#/components/schemas/NoveltyVerdict"
        similarity:
          $ref: "#/components/schemas/SimilaritySnapshot"
        source_date:
          type: string
          format: date
          description: >
            Publication date of the source itself (YYYY-MM-DD), not when the
            reading was ingested. Absent on existing readings and when unknown.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        error:
          $ref: "#/components/schemas/ManifestError"
        active_attempt:
          $ref: "#/components/schemas/ProcessingAttemptSummary"
        last_attempt:
          $ref: "#/components/schemas/ProcessingAttemptSummary"
        enrichment_degradation:
          $ref: "#/components/schemas/EnrichmentDegradation"
        desk_position:
          $ref: "#/components/schemas/DeskPosition"
        connection_count:
          type: integer
          minimum: 0
          description: >-
            The reading's connections whose target still exists. Set on list
            rows; absent from archive index.json items.
        tension_count:
          type: integer
          minimum: 0
          description: The reading's tensions whose target still exists, as connection_count.

    RelationshipsReading:
      type: object
      additionalProperties: false
      required: [id, url, status, created_at]
      properties:
        id:
          type: string
          minLength: 1
        url:
          type: string
          format: uri
        title:
          type: string
          minLength: 1
        status:
          $ref: "#/components/schemas/ManifestStatus"
        tags:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time

    RelationshipRow:
      oneOf:
        - type: object
          additionalProperties: false
          required: [source_id, kind, target_id, reason]
          properties:
            source_id:
              type: string
              minLength: 1
            kind:
              const: connection
            target_id:
              type: string
              minLength: 1
            reason:
              type: string
        - type: object
          additionalProperties: false
          required: [source_id, kind, target_id, tension_kind, reason]
          properties:
            source_id:
              type: string
              minLength: 1
            kind:
              const: tension
            target_id:
              type: string
              minLength: 1
            tension_kind:
              $ref: "#/components/schemas/TensionKind"
            reason:
              type: string

    GetReadingRelationshipsResponse:
      type: object
      additionalProperties: false
      required: [readings, relationships]
      properties:
        readings:
          type: array
          description: >-
            Every ready reading, plus any reading at either end of a listed
            relationship, ordered by id, with read-time staleness applied.
          items:
            $ref: "#/components/schemas/RelationshipsReading"
        relationships:
          type: array
          description: >-
            Every relationship row whose target is a live reading, ordered by
            source_id, kind, then position.
          items:
            $ref: "#/components/schemas/RelationshipRow"

    ListReadingsResponse:
      type: object
      additionalProperties: false
      required: [readings, limit, offset, has_more]
      properties:
        readings:
          type: array
          items:
            $ref: "#/components/schemas/ListIndexItem"
        limit:
          type: integer
          minimum: 0
        offset:
          type: integer
          minimum: 0
        has_more:
          type: boolean

    ByUrlPointer:
      type: object
      additionalProperties: false
      required: [id, key_prefix]
      properties:
        id:
          type: string
          minLength: 1
        key_prefix:
          type: string
          minLength: 1

    PointerDiagnostic:
      type: object
      additionalProperties: false
      required: [exists, matches_manifest]
      properties:
        exists:
          type: boolean
        pointer:
          $ref: "#/components/schemas/ByUrlPointer"
        matches_manifest:
          type: boolean

    ReadingObjectInfo:
      type: object
      additionalProperties: false
      required: [key, size]
      properties:
        key:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 0
        uploaded:
          type: string

    GetReadingDiagnosticsResponse:
      type: object
      additionalProperties: false
      required: [id, key_prefix, manifest, index_item, pointers, objects, attempts]
      properties:
        id:
          type: string
          minLength: 1
        key_prefix:
          type: string
          minLength: 1
        manifest:
          $ref: "#/components/schemas/Manifest"
        index_item:
          oneOf:
            - $ref: "#/components/schemas/ListIndexItem"
            - type: "null"
        pointers:
          type: object
          additionalProperties: false
          required: [by_id, by_url]
          properties:
            by_id:
              $ref: "#/components/schemas/PointerDiagnostic"
            by_url:
              $ref: "#/components/schemas/PointerDiagnostic"
        objects:
          type: array
          items:
            $ref: "#/components/schemas/ReadingObjectInfo"
        attempts:
          type: array
          items:
            $ref: "#/components/schemas/ProcessingAttempt"
