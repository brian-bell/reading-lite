openapi: 3.1.0
info:
  title: reading-lite API
  version: 1.0.0
  summary: Personal reading corpus on Cloudflare Workers
  description: |
    Submit a URL (or import Markdown), get a structured summary, and search the
    corpus. Health, login options, and magic-link challenge/redeem are public
    entry points with their own guards. Logout handles its own session checks.
    The local-only development mailbox is outside this contract. Other
    application routes require authentication. Browser sessions use a host-only
    `__Host-session` cookie; programmatic clients use `Authorization: Bearer`.
    Scopes gate each reading operation (`readings:read`, `readings:write`, `readings:import`,
    `readings:delete`). Cookie-authenticated POST and DELETE requests also
    require header `X-CSRF-Token` (session-bound HMAC from `GET /api/whoami`).
    Bearer requests are exempt. Missing or invalid CSRF returns 403.

    Optional header `X-Expected-Tenant` pins the tenant layout the client
    expects (`usr_…` or `global`). When present, a mismatch returns 412 before
    any store write.

    Local `wrangler dev` has no Queue binding: submit/reprocess/import return
    503. Reads, search and similarity run against local PostgreSQL.
  contact:
    url: https://github.com/brian-bell/reading-lite
servers:
  - url: https://readinglite.ai
    description: Production (canonical)
  - url: https://readinglite.app
    description: Production (additional public host)
  - url: https://staging.readinglite.ai
    description: Staging (canonical)
  - url: https://staging.readinglite.app
    description: Staging (additional public host)
  - url: http://127.0.0.1:8787
    description: Local wrangler dev
tags:
  - name: health
    description: Unauthenticated liveness
  - name: identity
    description: Authenticated principal introspection
  - name: readings
    description: Corpus read and write paths
  - name: exports
    description: Session archive export
  - name: inbox
    description: Staged Markdown awaiting review before it becomes a reading
  - name: desk
    description: Up to three readings the reader means to read next
security:
  - bearerAuth: []
  - sessionCookie: []

paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Worker is up
          content:
            text/plain:
              schema:
                type: string
                const: ok

  /api/whoami:
    get:
      tags: [identity]
      operationId: getWhoami
      summary: Authenticated principal identity
      description: |
        Returns the tenant and user the caller acts as, plus whether
        `TENANT_DATA_PLANE=1`. No scope gate beyond authentication. Session
        principals also receive `csrf_token` for cookie mutations; bearer
        principals omit that field.
      responses:
        "200":
          description: Principal identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhoamiResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/AuthMisconfigured"

  /api/account:
    delete:
      security:
        - sessionCookie: []
      tags: [identity]
      operationId: deleteAccount
      summary: Start account deletion (credential and write suppression)
      description: |
        Session cookie plus `X-CSRF-Token`. Requires recent magic-link
        authentication (10 minutes). Bearer 403. Body must be
        `{ "confirm": "delete" }`. Optional `X-Expected-Tenant` mismatch
        returns 412 after CSRF and before the recent-authentication check.

        Marks `users.status=deleting` first, then revokes every session and
        API token, sends a deletion-start security notification (no secrets)
        on the first transition, and clears the current cookie. Subsequent
        authenticated requests 403 because the account is no longer active
        (revoked cookies/tokens 401). Queue, DLQ, digest, and notification
        paths refuse to resurrect data for a deleting tenant.

        Cron starts the tenant wipe after a seven-day grace: the tenant's
        reading rows (embeddings with them), then its R2 prefix. Once the wipe
        completes and
        the prefix is confirmed empty, cron writes an audit record, purges
        tenant Durable Object state, rechecks the prefix, and deletes child
        rows before the user. No relationship cascades. Global incurred
        spend survives teardown.
        The founder and staging fixtures have no deletion exemption.
        Retained global corpus data is outside the tenant wipe. See
        operations.md for confirmation rules, residue repair, and known limits.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/ExpectedTenant"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteAccountBody"
      responses:
        "200":
          description: Deletion started (credentials revoked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteAccountResponse"
        "400":
          $ref: "#/components/responses/InvalidBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Forbidden principal, CSRF, bearer, or recent authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "412":
          $ref: "#/components/responses/ExpectedTenantMismatch"
        "500":
          $ref: "#/components/responses/AuthMisconfigured"

  /api/exports:
    parameters:
      - $ref: "#/components/parameters/ExpectedTenant"
    post:
      security:
        - sessionCookie: []
      tags: [exports]
      operationId: requestArchiveExport
      summary: Request a full-archive export
      description: |
        Session cookie plus `X-CSRF-Token`. Bearer tokens are refused 403.
        No recent-authentication step. One active (queued or building) export
        per tenant; a second request is 409. A queued, building, or ready
        request inside the rolling 24 hours is 429 with `reset_at`. Failed,
        cancelled, and expired requests do not count. Enqueues `ARCHIVE_EXPORT_JOBS`.
        Local `wrangler dev` has no export queue and returns 503.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "202":
          description: Export queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostArchiveExportResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Forbidden principal, CSRF, or bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: An export is already queued or building
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveExportActiveError"
        "412":
          $ref: "#/components/responses/ExpectedTenantMismatch"
        "429":
          description: A counted export was requested in the rolling day
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveExportDailyLimit"
        "500":
          $ref: "#/components/responses/AuthMisconfigured"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/exports/latest:
    parameters:
      - $ref: "#/components/parameters/ExpectedTenant"
    get:
      security:
        - sessionCookie: []
      tags: [exports]
      operationId: getLatestArchiveExport
      summary: Latest archive export and the next time a request is allowed
      description: |
        Session cookie. Bearer tokens are refused 403. `export` is null when
        the tenant has never requested one. `next_allowed_at` is now when no
        queued, building, or ready request is inside the rolling day. A ready
        export past its `expires_at` reports `expired`, as its download does.
      responses:
        "200":
          description: Latest export, if any
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetArchiveExportLatestResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "412":
          $ref: "#/components/responses/ExpectedTenantMismatch"
        "500":
          $ref: "#/components/responses/AuthMisconfigured"

  /api/exports/{id}/download:
    parameters:
      - $ref: "#/components/parameters/ExpectedTenant"
      - name: id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
    get:
      security:
        - sessionCookie: []
      tags: [exports]
      operationId: downloadArchiveExport
      summary: Download a ready archive export
      description: |
        Session cookie. Bearer tokens are refused 403. Another tenant's id is
        404. A row that is not ready is 409. An export past its `expires_at`
        (seven days after it finished) is 410, whether or not the cron has
        marked it expired and deleted its parts yet. The body is one zip: each segment's
        local bytes, then each central-directory fragment, then the
        end-of-central-directory record. `Content-Length` is the summed part
        sizes and `Content-Disposition` is an attachment.
      responses:
        "200":
          description: Zip archive
          headers:
            Content-Disposition:
              schema:
                type: string
              description: attachment filename
            Content-Length:
              schema:
                type: integer
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The export is not ready to download
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveExportNotReady"
        "410":
          description: The export expired; request a new one
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveExportExpired"
        "412":
          $ref: "#/components/responses/ExpectedTenantMismatch"
        "500":
          description: A stored segment is missing or the wrong size
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /api/auth/login-options:
    get:
      tags: [identity]
      operationId: getAuthLoginOptions
      summary: Public Turnstile site key for the login widget
      security: []
      description: |
        Unauthenticated, same-origin, `Cache-Control: no-store`. Chrome omits
        `Origin` on same-origin GET; this endpoint allows a missing Origin when
        `Sec-Fetch-Site: same-origin` (same gate as `GET /api/whoami`). A
        cross-site Origin is 403. Returns `{ turnstile_site_key }` as the
        configured public widget key when `signup_mode` is `open` and
        `TURNSTILE_SITE_KEY` is set; otherwise `null`. Does not disclose
        whether any email exists, is invited, or is suspended.
      responses:
        "200":
          description: Login widget options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLoginOptionsResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/AuthMisconfigured"

  /api/auth/challenge:
    post:
      tags: [identity]
      operationId: requestAuthChallenge
      summary: Request a magic-link login challenge
      security: []
      description: |
        Same-origin. Always returns a generic `{ ok: true }` so callers cannot
        enumerate users or invites. Existing active users can request a link in
        every signup mode. Unknown addresses are eligible when current policy
        is `open`, or when policy is `invite_only` and a live `signup_invites`
        row allows provisioning. `closed` never provisions unknown addresses
        (an invite row is not enough). Open-mode challenges that would send
        mail require a successful Turnstile verification when the secret is
        configured; local skip/fail-open if the secret is unset;
        staging/production fail-closed (missing secret, siteverify errors, or
        `success ≠ true` skip send). Invalid or missing `turnstile_token` still
        returns `{ ok: true }` and skips send (`magic_link_turnstile_rejected`).
        invite_only and closed ignore an extra token. Issuing a new login
        challenge revokes any prior unconsumed challenge for that canonical
        email. The 15-minute secret is delivered out of band and lives in the
        frontend URL fragment, not this response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthChallengeBody"
      responses:
        "200":
          description: Generic acknowledgement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthChallengeResponse"
        "400":
          $ref: "#/components/responses/InvalidBody"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/auth/redeem:
    post:
      tags: [identity]
      operationId: redeemAuthChallenge
      summary: Redeem a magic-link challenge into a host-only session cookie
      security: []
      description: |
        Same-origin POST of the fragment secret after an explicit user
        gesture. Idempotent for the same `redemption_id`; a competing claimant
        fails. Sets a durable host-only `__Host-session` cookie
        (`Secure; HttpOnly; Path=/; SameSite=Lax; Max-Age=7776000`) so login
        survives browser restart. The control plane still enforces a 30-day inactivity
        timeout and 90-day absolute expiry. If the request already carries a
        live session cookie for the same user, login redemption refreshes
        `authenticated_at_ms` on that row instead of inserting another session.

        Challenges with `purpose=email_change` complete a verified email swap
        instead of issuing a session: they do not provision users or consult
        signup eligibility. Confirm requires the live browser session that
        called `POST /api/auth/email-change`. Cookie-less redeem returns 401
        and does not swap, consume, revoke, or send security mail. A cookie
        that is not that confirming session (other device, other session,
        expired, or revoked) returns 403 with the same no-commit behavior.
        A matching live confirming session must also send `Origin` and
        `X-CSRF-Token` (403 on CSRF failure). Login redeem does not require
        CSRF and still mints a session when no cookie is present.

        The unique canonical email is swapped atomically; a uniqueness race
        fails closed. Other sessions and all `api_tokens` are revoked; the
        confirming session is kept. The previous address receives a security
        notification. Click/open tracking is a Resend domain setting (off by
        default), not a send-payload field.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRedeemBody"
      responses:
        "200":
          description: Session issued
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthRedeemResponse"
        "400":
          $ref: "#/components/responses/InvalidBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Competing claimant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /api/auth/logout:
    post:
      tags: [identity]
      operationId: logoutSession
      summary: Revoke the current browser session and clear the cookie
      security: []
      description: |
        Same-origin. Revokes the stored session and expires `__Host-session`.
        Cookie callers must send `X-CSRF-Token`; a missing or invalid token
        returns 403 without clearing the cookie.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLogoutResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/auth/sessions:
    get:
      tags: [identity]
      operationId: listAuthSessions
      summary: List the caller's browser sessions
      description: |
        Returns session rows for the authenticated user (id, created,
        authenticated, last-seen, idle/absolute expiry, revoked, reason,
        user-agent label, usable). Marks the current cookie session via
        `current`. Idle- or absolute-expired rows stay in the list with
        `usable: false` so the client can inspect them. When the account
        is at the ten-session cap, `session_cap_warning` is a non-null
        string the client can show before the next login evicts the
        least-recently-used session. CSRF is not required (GET). Optional
        `X-Expected-Tenant` mismatch returns 412, as on `/api/readings`.
      parameters:
        - $ref: "#/components/parameters/ExpectedTenant"
      responses:
        "200":
          description: Session list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSessionsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "412":
          $ref: "#/components/responses/ExpectedTenantMismatch"
        "500":
          $ref: "#/components/responses/AuthMisconfigured"

  /api/auth/sessions/revoke-all:
    post:
      tags: [identity]
      operationId: revokeAllAuthSessions
      summary: Revoke every browser session and log the caller out
      description: |
        Soft-revokes all of the caller's sessions. Cookie callers must send
        `X-CSRF-Token`; recent-auth is not required. The current cookie is
        cleared. Sends a security notification (no secrets) only when at least
        one session was actually revoked. Click/open tracking is a Resend
        domain setting (off by default), not a send-payload field.
        Single-session revoke does not send mail. Optional `X-Expected-Tenant`
        mismatch returns 412 after CSRF (same order as readings writes).
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/ExpectedTenant"
      responses:
        "200":
          description: All sessions revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionRevokeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "412":
          $ref: "#/components/responses/ExpectedTenantMismatch"
        "500":
          $ref: "#/components/responses/AuthMisconfigured"

  /api/auth/sessions/{id}:
    delete:
      tags: [identity]
      operationId: revokeAuthSession
      summary: Revoke one browser session
      description: |
        Soft-revokes one of the caller's sessions. Cookie callers must send
        `X-CSRF-Token`; recent-auth is not required. If the id is the current
        session, the cookie is cleared. Does not send security mail. Optional
        `X-Expected-Tenant` mismatch returns 412 after CSRF.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: "^ses_"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/ExpectedTenant"
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionRevokeResponse"
        "400":
          $ref: "#/components/responses/InvalidBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/ExpectedTenantMismatch"

  /api/auth/tokens:
    get:
      security:
        - sessionCookie: []
      tags: [identity]
      operationId: listAuthTokens
      summary: List the caller's API tokens
      description: |
        Session cookie only (bearer 403). CSRF is not required (GET). Returns
        token metadata without secrets (`id`, name, format, scopes, timestamps,
        `usable`). Revoked and expired rows stay in the list with
        `usable: false`. The founder legacy token is included. Optional
        `X-Expected-Tenant` mismatch returns 412, as on `/api/readings`.
      parameters:
        - $ref: "#/components/parameters/ExpectedTenant"
      responses:
        "200":
          description: Token list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListTokensResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "412":
          $ref: "#/components/responses/ExpectedTenantMismatch"
        "500":
          $ref: "#/components/responses/AuthMisconfigured"
    post:
      security:
        - sessionCookie: []
      tags: [identity]
      operationId: createAuthToken
      summary: Mint a standard API token
      description: |
        Session cookie plus `X-CSRF-Token`. Requires recent magic-link
        authentication (10 minutes). Bearer 403. Body `{ name, scopes,
        expires_at_ms? }`. Mints `format=standard` HMAC material and returns
        the `tok_{uuid}.{hex}` credential once. Default expiry is 90 days;
        `expires_at_ms` may not exceed now + 90 days. Empty or unknown scopes
        are rejected. At 10 active tokens (including the founder legacy row)
        returns 409. Sends a security notification on create (no secrets).
        Optional `X-Expected-Tenant` mismatch returns 412 after CSRF and
        before the recent-authentication check.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/ExpectedTenant"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCreateTokenBody"
      responses:
        "201":
          description: Token minted (secret returned once)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthCreateTokenResponse"
        "400":
          $ref: "#/components/responses/InvalidBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Forbidden principal, CSRF, or recent authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: Ten active tokens already exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: too many active tokens
        "412":
          $ref: "#/components/responses/ExpectedTenantMismatch"
        "500":
          $ref: "#/components/responses/AuthMisconfigured"

  /api/auth/tokens/{id}:
    delete:
      security:
        - sessionCookie: []
      tags: [identity]
      operationId: revokeAuthToken
      summary: Revoke one API token
      description: |
        Session cookie plus `X-CSRF-Token`. Recent-auth is not required.
        Bearer 403. Soft-revokes a token owned by the caller. Does not send
        security mail. Does not mark pending work failed; queued jobs recheck
        the token on admit. 404 if the id is not owned. Optional
        `X-Expected-Tenant` mismatch returns 412 after CSRF.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: "^tok_"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/ExpectedTenant"
      responses:
        "200":
          description: Token revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenRevokeResponse"
        "400":
          $ref: "#/components/responses/InvalidBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/ExpectedTenantMismatch"

  /api/auth/email-change:
    post:
      security:
        - sessionCookie: []
      tags: [identity]
      operationId: requestEmailChange
      summary: Request a verified login-email change
      description: |
        Session cookie plus `X-CSRF-Token`. Requires recent magic-link
        authentication (10 minutes). Body `{ email }` is the new address.
        Always returns a generic `{ ok: true }` so callers cannot enumerate
        whether that address is already taken. Issues a 15-minute
        `purpose=email_change` challenge bound to the caller `user_id` and
        the requesting session. Confirm via `POST /api/auth/redeem` from that
        same signed-in browser (fragment + explicit POST). Cookie-less or
        other-session redeem does not swap. Does not consult signup
        eligibility. Does not change staging `AUTH_MAIL_ALLOWLIST`.
        Click/open tracking is a Resend domain setting (off by default), not a
        send-payload field. Optional `X-Expected-Tenant` mismatch returns 412
        after CSRF and before the recent-auth check, and sends no link.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/ExpectedTenant"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthEmailChangeBody"
      responses:
        "200":
          description: Generic acknowledgement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthChallengeResponse"
        "400":
          $ref: "#/components/responses/InvalidBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Forbidden origin, CSRF, bearer, or recent authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "412":
          $ref: "#/components/responses/ExpectedTenantMismatch"
        "500":
          $ref: "#/components/responses/AuthMisconfigured"

  /api/auth/settings:
    get:
      security:
        - sessionCookie: []
      tags: [identity]
      operationId: getAuthSettings
      summary: Return the caller's full settings row
      description: |
        Session cookie only (bearer 403). CSRF is not required (GET). Returns
        the full `user_settings` row (`notify_immediate`, digest cadence and
        schedule, timestamps). 404 when the row is missing. Recent-auth is
        not required. Optional `X-Expected-Tenant` mismatch returns 412, as
        on `/api/readings`.
      parameters:
        - $ref: "#/components/parameters/ExpectedTenant"
      responses:
        "200":
          description: Settings row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettingsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/ExpectedTenantMismatch"
        "500":
          $ref: "#/components/responses/AuthMisconfigured"
    post:
      security:
        - sessionCookie: []
      tags: [identity]
      operationId: updateAuthSettings
      summary: Update notification and digest settings
      description: |
        Session cookie plus `X-CSRF-Token`. Recent-auth is not required.
        Bearer 403. Body `{ notify_immediate }` plus optional digest
        schedule fields (`digest_cadence`, `time_zone`, `digest_hour_local`,
        `digest_weekday`). Digest opt-out is `digest_cadence: off`; hour,
        weekday, and time zone are still stored when cadence is off.
        Returns the full settings row. 404 when the row is missing.
        Optional `X-Expected-Tenant` mismatch returns 412 after CSRF (same
        order as readings writes) and changes nothing.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/ExpectedTenant"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostAuthSettingsBody"
      responses:
        "200":
          description: Settings row after update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettingsResponse"
        "400":
          $ref: "#/components/responses/InvalidBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/ExpectedTenantMismatch"
        "500":
          $ref: "#/components/responses/AuthMisconfigured"

  /api/auth/provider:
    get:
      security:
        - sessionCookie: []
      tags: [identity]
      operationId: getProviderSettings
      summary: Return masked provider settings
      description: |
        Session cookie only (bearer 403, including API and MCP tokens). CSRF
        is not required (GET). Recent-auth is not required. Returns the
        masked OpenAI credential and the masked Anthropic credential (each or
        null), the summarization provider, summarization effort, the reader's daily
        spend cap, the effective cap, and the operator default from
        `tenant_limits.daily_spend_microdollars`. Never returns the key.
        Optional `X-Expected-Tenant` mismatch returns 412.
      parameters:
        - $ref: "#/components/parameters/ExpectedTenant"
      responses:
        "200":
          description: Masked provider settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderSettingsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/ExpectedTenantMismatch"
        "500":
          $ref: "#/components/responses/AuthMisconfigured"
    post:
      security:
        - sessionCookie: []
      tags: [identity]
      operationId: connectProviderKey
      summary: Connect or replace the OpenAI key
      description: |
        Session cookie, `X-CSRF-Token`, and recent sign-in. Bearer 403.
        Validates the key with OpenAI's free model-list endpoint and stores
        it only when the fixed summarization model and `text-embedding-3-small`
        are listed. A failed check stores nothing. The response is the masked
        settings view. The key is never returned.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/ExpectedTenant"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostProviderKeyBody"
      responses:
        "200":
          description: Masked settings after the key is stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderSettingsResponse"
        "400":
          description: Invalid body, invalid key, or the key cannot see a required model
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorMessage"
                  - $ref: "#/components/schemas/ProviderSettingsError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Forbidden origin, CSRF, bearer, or recent authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/ExpectedTenantMismatch"
        "500":
          $ref: "#/components/responses/AuthMisconfigured"
        "503":
          description: OpenAI's model list could not be checked. Nothing was stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderSettingsError"
    delete:
      security:
        - sessionCookie: []
      tags: [identity]
      operationId: deleteProviderKey
      summary: Remove the stored OpenAI key
      description: |
        Session cookie, `X-CSRF-Token`, and recent sign-in. Bearer 403.
        Deletes the OpenAI credential row only; an Anthropic key stays.
        Idempotent when no key is stored. Returns the masked settings view
        with a null credential.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/ExpectedTenant"
      responses:
        "200":
          description: Masked settings after removal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderSettingsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Forbidden origin, CSRF, bearer, or recent authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/ExpectedTenantMismatch"
        "500":
          $ref: "#/components/responses/AuthMisconfigured"

  /api/auth/provider/preferences:
    post:
      security:
        - sessionCookie: []
      tags: [identity]
      operationId: updateProviderPreferences
      summary: Change the summarization provider, effort, or the daily spend cap
      description: |
        Session cookie plus `X-CSRF-Token`. Recent-auth is not required, the
        same gate as `POST /api/auth/settings`. Bearer 403. Effort is
        `low`, `medium`, or `high`. The daily cap may be lowered or cleared
        (null) and may not be set above
        `tenant_limits.daily_spend_microdollars`. Selecting `anthropic` as
        the summarization provider requires an active Anthropic key, otherwise
        400 `anthropic_key_required`. A refused cap or selection changes
        nothing. Returns the masked settings view.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/ExpectedTenant"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostProviderPreferencesBody"
      responses:
        "200":
          description: Masked settings after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderSettingsResponse"
        "400":
          description: Invalid body, a cap above the operator default, or Anthropic selected without an active Anthropic key
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorMessage"
                  - $ref: "#/components/schemas/ProviderSettingsError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/ExpectedTenantMismatch"
        "500":
          $ref: "#/components/responses/AuthMisconfigured"

  /api/auth/provider/usage:
    get:
      security:
        - sessionCookie: []
      tags: [identity]
      operationId: getProviderUsage
      summary: Return today's spend against the reader's daily cap
      description: |
        Session cookie only (bearer 403). CSRF and recent-auth are not
        required. Read-only: returns the tenant's UTC-day total charged
        against its spend budget, the effective daily cap, and when the day
        resets. Charged includes unsettled maxima and unused holds, so it is
        not a provider invoice, and it counts every spend operation billed to
        this tenant, whoever pays. The cap is read from PostgreSQL and the
        charge from the spend guard; they are separate observations.
        Optional `X-Expected-Tenant` mismatch returns 412.
      parameters:
        - $ref: "#/components/parameters/ExpectedTenant"
      responses:
        "200":
          description: Today's charged spend and the effective cap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderUsageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/ExpectedTenantMismatch"
        "500":
          $ref: "#/components/responses/AuthMisconfigured"
        "503":
          description: The spend guard could not answer. No figure is returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /api/readings:
    parameters:
      - $ref: "#/components/parameters/ExpectedTenant"
    get:
      tags: [readings]
      operationId: listReadings
      summary: List readings (newest first)
      description: |
        Server-side filter over the tenant's reading rows. `q` is a
        case-insensitive substring across title, tldr, url, and keywords.
        `tag` is an exact case-insensitive match on tags only.
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: tag
          in: query
          schema:
            type: string
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Page of list-index items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListReadingsResponse"
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "412":
          $ref: "#/components/responses/ExpectedTenantMismatch"
      x-required-scope: readings:read
    post:
      tags: [readings]
      operationId: submitReading
      summary: Submit a URL for processing
      description: |
        Claims the tenant's URL-ownership row, commits the pending reading with
        its attempt and job, and enqueues the job.
        Ready/pending owners return 200 with the existing manifest. Failed
        owners reprocess the same id (202). URLs with embedded userinfo or a
        blocked literal host (loopback/private) are rejected 400 before
        claiming — they can never extract.
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostReadingsBody"
      responses:
        "200":
          description: Existing ready or pending owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Manifest"
        "202":
          description: New or reprocessed pending attempt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivatedReading"
        "400":
          $ref: "#/components/responses/InvalidBodyOrUrl"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/IntakeConflict"
        "412":
          $ref: "#/components/responses/ExpectedTenantMismatch"
        "429":
          $ref: "#/components/responses/QuotaDenied"
        "503":
          $ref: "#/components/responses/Unavailable"
      x-required-scope: readings:write

  /api/readings/import-markdown:
    parameters:
      - $ref: "#/components/parameters/ExpectedTenant"
    post:
      tags: [readings]
      operationId: importMarkdown
      summary: Import Markdown as a reading
      description: |
        Uses `source_url` for identity/dedupe, skips fetching, and processes the
        supplied Markdown. Imports are always silent at send time, even when
        `email` is true. Ready/pending owners return 200; failed owners reprocess
        the same id (202).
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostReadingsImportMarkdownBody"
      responses:
        "200":
          description: Existing ready or pending owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Manifest"
        "202":
          description: New or reprocessed pending attempt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivatedReading"
        "400":
          $ref: "#/components/responses/InvalidBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/IntakeConflict"
        "412":
          $ref: "#/components/responses/ExpectedTenantMismatch"
        "429":
          $ref: "#/components/responses/QuotaDenied"
        "503":
          $ref: "#/components/responses/Unavailable"
      x-required-scope: readings:import

  /api/readings/lookup:
    parameters:
      - $ref: "#/components/parameters/ExpectedTenant"
    get:
      tags: [readings]
      operationId: lookupReadingByUrl
      summary: Resolve the owner id for a URL
      description: |
        Side-effect-free. Resolves the tenant's URL-ownership row; never claims
        a URL or writes anything.
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
            format: uri
      responses:
        "200":
          description: Owner found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LookupResponse"
        "400":
          description: Missing url
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: missing url
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/ExpectedTenantMismatch"
      x-required-scope: readings:read

  /api/readings/relationships:
    parameters:
      - $ref: "#/components/parameters/ExpectedTenant"
    get:
      tags: [readings]
      operationId: getReadingRelationships
      summary: Read the tenant's relationship graph
      description: |
        One read for the Threads pages: every relationship row whose target is
        live, and every ready reading plus the readings at either end of those
        rows. Not paged; makes no provider call.
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "200":
          description: The tenant's relationship graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetReadingRelationshipsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "412":
          $ref: "#/components/responses/ExpectedTenantMismatch"
      x-required-scope: readings:read

  /api/readings/similar:
    parameters:
      - $ref: "#/components/parameters/ExpectedTenant"
    post:
      tags: [readings]
      operationId: querySimilarReadings
      summary: Top-K similar readings by embedding
      description: |
        Exact cosine similarity over the tenant's embeddings in PostgreSQL
        (pgvector).
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostReadingsSimilarBody"
      responses:
        "200":
          description: Similarity hits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostReadingsSimilarResponse"
        "400":
          $ref: "#/components/responses/InvalidBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "412":
          $ref: "#/components/responses/ExpectedTenantMismatch"
      x-required-scope: readings:write

  /api/readings/{id}:
    parameters:
      - $ref: "#/components/parameters/ExpectedTenant"
      - $ref: "#/components/parameters/ReadingId"
    get:
      tags: [readings]
      operationId: getReading
      summary: Get a reading manifest with its relationship targets
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "200":
          description: |
            Manifest (stale pending/attempts may be annotated as failed at read
            time) plus relationship_targets resolved from the tenant's reading
            rows. Missing ids are removed or unavailable targets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadingDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/ExpectedTenantMismatch"
      x-required-scope: readings:read
    delete:
      tags: [readings]
      operationId: deleteReading
      summary: Purge a reading
      description: |
        Deletes the reading's row in one transaction (its URL ownership,
        revisions, relationships, embedding, attempts and jobs cascade), then
        the R2 objects under its prefix. 409 while an
        attempt is actively running (stale attempts past the pending TTL do
        not block). Inbound `connections` on other readings may still name the
        deleted id.
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Purge report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteReadingResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Active attempt in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: reading already has an active attempt
        "412":
          $ref: "#/components/responses/ExpectedTenantMismatch"
      x-required-scope: readings:delete

  /api/readings/{id}/diagnostics:
    parameters:
      - $ref: "#/components/parameters/ExpectedTenant"
      - $ref: "#/components/parameters/ReadingId"
    get:
      tags: [readings]
      operationId: getReadingDiagnostics
      summary: Inspect manifest, pointers, objects, and attempts
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "200":
          description: Diagnostics bundle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetReadingDiagnosticsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/ExpectedTenantMismatch"
      x-required-scope: readings:read

  /api/readings/{id}/reprocess:
    parameters:
      - $ref: "#/components/parameters/ExpectedTenant"
      - $ref: "#/components/parameters/ReadingId"
    post:
      tags: [readings]
      operationId: reprocessReading
      summary: Start a fresh processing attempt
      description: |
        Optional empty body. `force: true` bypasses an active-attempt conflict.
        Optional `source: { kind: "markdown", … }` reprocesses supplied Markdown
        instead of re-fetching the URL (and takes precedence over stored
        Markdown). On success the reading becomes `source_type: "markdown"`;
        on failure prior source type is retained, and a previously ready
        reading keeps its published content, summary, and embedding (each
        attempt writes under its own revision prefix). Markdown must
        fit the Cloudflare 128 KB queue-message limit or the attempt rolls back
        with 503. A URL-backed reprocess of a reading whose stored URL is
        categorically unfetchable (userinfo, blocked literal host) returns 400
        `unsupported_url` without starting an attempt; supply `source` markdown
        instead.
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostReadingReprocessBody"
      responses:
        "200":
          description: Existing ready/pending outcome (rare for reprocess)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Manifest"
        "202":
          description: Reprocess enqueued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivatedReading"
        "400":
          $ref: "#/components/responses/InvalidBodyOrUrl"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/IntakeConflict"
        "412":
          $ref: "#/components/responses/ExpectedTenantMismatch"
        "429":
          $ref: "#/components/responses/QuotaDenied"
        "503":
          $ref: "#/components/responses/Unavailable"
      x-required-scope: readings:write

  /api/readings/{id}/content:
    parameters:
      - $ref: "#/components/parameters/ExpectedTenant"
      - $ref: "#/components/parameters/ReadingId"
    get:
      tags: [readings]
      operationId: getReadingContent
      summary: Stream extracted Markdown
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "200":
          description: Extracted markdown (`extracted.md`)
          content:
            text/markdown:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Missing reading, or `content_status` is not `captured`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "412":
          $ref: "#/components/responses/ExpectedTenantMismatch"
      x-required-scope: readings:read

  /api/readings/{id}/content/raw:
    parameters:
      - $ref: "#/components/parameters/ExpectedTenant"
      - $ref: "#/components/parameters/ReadingId"
    get:
      tags: [readings]
      operationId: getReadingRawContent
      summary: Stream raw captured bytes
      description: Returns the original bytes with the stored `content_type`.
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "200":
          description: Raw source bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/ExpectedTenantMismatch"
      x-required-scope: readings:read

  /api/desk:
    parameters:
      - $ref: "#/components/parameters/ExpectedTenant"
    get:
      tags: [desk]
      operationId: getDesk
      summary: Read the desk page
      description: |
        The desk and the groups the desk page lists around it, one READ ONLY
        snapshot, every row a list item after read-time staleness.
        `on_desk` is the desk in position order, any status. `needs_you` is
        failed readings and ready ones whose last attempt is a failed
        reprocess, unless another attempt is running. `processing` is pending
        readings. `ready_since` is ready
        readings created after `since` that are not on the desk; it is empty
        without `since`. A ready reading whose reprocess failed is in both
        `needs_you` and `ready_since`. Each group is newest first and
        bounded, with its unbounded count beside it.
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - name: since
          in: query
          required: false
          description: The reader's previous visit, an ISO 8601 date-time
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: The desk and its groups
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetDeskResponse"
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "412":
          $ref: "#/components/responses/ExpectedTenantMismatch"
      x-required-scope: readings:read
    post:
      tags: [desk]
      operationId: addToDesk
      summary: Put a reading on the desk
      description: |
        Appends a ready reading to the tenant's desk, which holds at most
        three. A reading already on the desk returns 200 unchanged, whatever
        its status. Takes the tenant's desk lock and the reading row FOR
        SHARE, then renumbers the desk 1..n. Never updates the reading row.
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostDeskBody"
      responses:
        "200":
          description: The desk, in position order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeskWriteResponse"
        "400":
          $ref: "#/components/responses/InvalidBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The reading is not ready, or the desk already holds three
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/DeskNotReadyError"
                  - $ref: "#/components/schemas/DeskFullError"
        "412":
          $ref: "#/components/responses/ExpectedTenantMismatch"
      x-required-scope: readings:write
    delete:
      tags: [desk]
      operationId: clearDesk
      summary: Clear the desk
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: The empty desk
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeskWriteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "412":
          $ref: "#/components/responses/ExpectedTenantMismatch"
      x-required-scope: readings:write

  /api/desk/{id}:
    parameters:
      - $ref: "#/components/parameters/ExpectedTenant"
      - $ref: "#/components/parameters/ReadingId"
    delete:
      tags: [desk]
      operationId: removeFromDesk
      summary: Take a reading off the desk
      description: |
        Removes the reading and renumbers the rest 1..n. A reading not on
        the desk is a no-op.
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: The desk, in position order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeskWriteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/ExpectedTenantMismatch"
      x-required-scope: readings:write

  /api/inbox:
    parameters:
      - $ref: "#/components/parameters/ExpectedTenant"
    post:
      tags: [inbox]
      operationId: stageInboxItem
      summary: Stage Markdown in the inbox
      description: |
        Writes one inbox item and nothing else: no reading, URL claim,
        attempt, job, embedding or queue message, and no reading quota. It is
        charged one request against the request rate. The item is not in the
        library, search, similarity or `/lookup`.

        One item per URL: re-staging a URL overwrites its Markdown and title
        (an omitted title clears it) and keeps its id (200, `replaced: true`).
        A ready or pending reading that already owns the URL is returned
        (200 `existing`), nothing is staged, and any item staged for the URL
        earlier is discarded. A failed owner is named as
        `corpus_reading`. An item must fit the 128,000-byte promote message
        (413) and a tenant is capped at 200 items (429 `inbox_full` for a new URL; an overwrite is
        always allowed).
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostInboxBody"
      responses:
        "200":
          description: Staged item overwritten, or an existing ready or pending owner
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PostInboxStagedResponse"
                  - $ref: "#/components/schemas/PostInboxExistingResponse"
        "201":
          description: New inbox item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostInboxStagedResponse"
        "400":
          $ref: "#/components/responses/InvalidBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "412":
          $ref: "#/components/responses/ExpectedTenantMismatch"
        "413":
          description: |
            The JSON serialization of `source_url`, `title` and `markdown`
            is over 126,976 bytes (UTF-8): the 128,000-byte promote message
            less 1,024 bytes for its envelope. An untitled item for a failed
            owner is measured with the owner's title, which promote keeps.
            Also returned, before parsing, for a request body too large to
            hold an acceptable item, whether or not it declares a
            Content-Length.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxMarkdownTooLargeResponse"
        "429":
          description: |
            Request rate exceeded or usage guard unavailable (with
            `Retry-After`), or the inbox is full (`inbox_full`, no
            `Retry-After`: it frees up only when items are discarded or
            promoted).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/QuotaDeniedResponse"
                  - $ref: "#/components/schemas/UsageGuardUnavailableResponse"
                  - $ref: "#/components/schemas/InboxFullResponse"
      x-required-scope: readings:import
    get:
      tags: [inbox]
      operationId: listInbox
      summary: List inbox items
      description: Every item's metadata, without Markdown, most recently staged first.
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "200":
          description: Inbox items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListInboxResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "412":
          $ref: "#/components/responses/ExpectedTenantMismatch"
      x-required-scope: readings:read

  /api/inbox/{id}:
    parameters:
      - $ref: "#/components/parameters/ExpectedTenant"
      - $ref: "#/components/parameters/InboxItemId"
    get:
      tags: [inbox]
      operationId: getInboxItem
      summary: Get an inbox item with its Markdown
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "200":
          description: Inbox item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/ExpectedTenantMismatch"
      x-required-scope: readings:read
    delete:
      tags: [inbox]
      operationId: discardInboxItem
      summary: Discard an inbox item
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Discarded
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/ExpectedTenantMismatch"
      x-required-scope: readings:import

  /api/inbox/{id}/promote:
    parameters:
      - $ref: "#/components/parameters/ExpectedTenant"
      - $ref: "#/components/parameters/InboxItemId"
    post:
      tags: [inbox]
      operationId: promoteInboxItem
      summary: Promote an inbox item into the library
      description: |
        Imports the item's Markdown, URL and title exactly as
        `POST /api/readings/import-markdown` would, and answers with that
        route's status and body plus `inbox_item_id`. A new URL is claimed
        (202), a failed owner is re-imported in place (202), and a ready or
        pending owner is returned (200). The request rate and the reading quota
        are charged here, not at stage.

        The item is deleted only on 202 or 200. If it was re-staged while the
        import ran, the newer item is kept and the body adds
        `inbox_item_retained: true`. Every other outcome keeps the item, so a
        promote can be retried; a retry after an import that activated returns
        the reading (200) and deletes the item.
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostInboxPromoteBody"
      responses:
        "200":
          description: Existing ready or pending owner; the item is deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostInboxPromoteExistingResponse"
        "202":
          description: New or re-imported pending attempt; the item is deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostInboxPromoteActivatedResponse"
        "400":
          $ref: "#/components/responses/InvalidBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            Missing `readings:import`, or the account stopped being active
            before the import committed (the body then carries
            `inbox_item_id`). The item is kept.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorMessage"
                  - $ref: "#/components/schemas/InboxPromoteErrorMessage"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The reading has an active attempt, or the tenant has no active
            provider key while tenant provider keys are on
            (`code: provider_key_required`). The item is kept.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/InboxPromoteErrorMessage"
                  - $ref: "#/components/schemas/InboxPromoteProviderKeyRequired"
        "412":
          $ref: "#/components/responses/ExpectedTenantMismatch"
        "413":
          description: |
            The promote message would exceed 126,976 bytes: the JSON of
            `source_url`, the title it carries and `markdown`. Stage already
            refuses such items, so this happens only when an untitled item's
            failed owner lends it a title stage did not count. Nothing is
            written, and the item is kept.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxPromoteTooLarge"
        "429":
          description: |
            Request rate or reading quota exceeded, or usage guard unavailable
            (with `Retry-After`). The item is kept.
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: Seconds until the caller may retry
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/InboxPromoteQuotaDenied"
                  - $ref: "#/components/schemas/InboxPromoteUsageGuardUnavailable"
        "503":
          description: |
            Queue unbound, contention, or the import's setup or queue send
            failed. The item is kept.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxPromoteUnavailable"
      x-required-scope: readings:import

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-session
      description: Host-only browser session. Cookie writes also require X-CSRF-Token.
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Founder legacy bearer (or session token) looked up in the control
        plane. Runtime auth
        does not fall back to the `READER_API_TOKEN` secret itself.

  parameters:
    ReadingId:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        description: Reading id (typically `rd_…`)
    InboxItemId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: "^in_"
        description: Inbox item id (`in_…`)
    ExpectedTenant:
      name: X-Expected-Tenant
      in: header
      required: false
      schema:
        type: string
        description: |
          Layout pin: principal tenant id (`usr_…`) when the data-plane gate is
          on, or `global` when it is off. Mismatch → 412.
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      schema:
        type: string
        pattern: "^[0-9a-f]{64}$"
        description: |
          Session-bound HMAC over the session id (HKDF domain `csrf`). Required
          on cookie-authenticated POST and DELETE. Bearer requests omit it.
          Missing or invalid → 403 (the session cookie stays).

  responses:
    Unauthorized:
      description: Missing or invalid bearer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
          example:
            error: unauthorized
    Forbidden:
      description: |
        Authenticated but lacking scope, forbidden principal, or invalid
        cookie CSRF token (session stays; frontend must not treat this as logout).
        On a write, also an account that stopped being active after the
        request authenticated: the claim saw it under the tenant lock and
        committed nothing.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
          example:
            error: forbidden
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
          example:
            error: not found
    InvalidBody:
      description: Request body failed zod validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"
    InvalidBodyOrUrl:
      description: |
        Invalid body (zod), or a URL the worker categorically refuses to
        fetch: embedded userinfo, or a blocked literal host (loopback /
        private / link-local). Refused before any URL ownership is claimed or
        attempt started.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/ValidationError"
              - $ref: "#/components/schemas/UnsupportedUrlError"
          example:
            error: "url rejected: userinfo is not allowed"
            code: unsupported_url
    InvalidQuery:
      description: Query string failed zod validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"
          example:
            error: invalid query
            details: "…"
    ExpectedTenantMismatch:
      description: >
        X-Expected-Tenant does not match the layout this request would use
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ExpectedTenantMismatch"
    AuthMisconfigured:
      description: Control-plane or auth-root secret missing/invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
          example:
            error: auth misconfigured
    IntakeConflict:
      description: |
        Active attempt in progress, markdown content unavailable for the
        requested operation, or (`code: provider_key_required`) tenant provider
        keys are on and the tenant has no active key. The last is decided after
        the request-rate admission and before anything is claimed; it is not
        retryable until the reader connects a key.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/ErrorMessage"
              - $ref: "#/components/schemas/ProviderKeyRequiredError"
    Unavailable:
      description: |
        Queue unbound, claim/activation contention, or queue send failure
        (includes oversized reprocess Markdown that cannot be enqueued).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UnavailableError"
    QuotaDenied:
      description: |
        Tenant request-rate or paid-work reading quota exceeded, or the usage
        guard is unavailable / tenant_limits is missing (fail closed). Always
        429 — never overloaded onto 503. Includes `Retry-After`.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: Seconds until the caller may retry
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/QuotaDeniedResponse"
              - $ref: "#/components/schemas/UsageGuardUnavailableResponse"

  schemas:
    ErrorMessage:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string

    PostDeskBody:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id:
          type: string
          minLength: 1

    DeskWriteResponse:
      type: object
      additionalProperties: false
      required: [desk]
      properties:
        desk:
          type: array
          maxItems: 3
          description: Reading ids in desk position order
          items:
            type: string

    GetDeskResponse:
      type: object
      additionalProperties: false
      required:
        - on_desk
        - needs_you
        - needs_you_total
        - processing
        - processing_total
        - ready_since
        - ready_since_total
      properties:
        on_desk:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/ListIndexItem"
        needs_you:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/ListIndexItem"
        needs_you_total:
          type: integer
          minimum: 0
        processing:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/ListIndexItem"
        processing_total:
          type: integer
          minimum: 0
        ready_since:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/ListIndexItem"
        ready_since_total:
          type: integer
          minimum: 0

    DeskPosition:
      type: integer
      minimum: 1
      maximum: 3
      description: >
        The reading's place on the desk, present only when it is on the desk.
        Response state from reading_desk, never part of the stored manifest.

    DeskNotReadyError:
      type: object
      additionalProperties: false
      required: [error, code]
      properties:
        error:
          type: string
        code:
          type: string
          enum: [not_ready]

    DeskFullError:
      type: object
      additionalProperties: false
      required: [error, code, limit]
      properties:
        error:
          type: string
        code:
          type: string
          enum: [desk_full]
        limit:
          type: integer
          enum: [3]

    ProviderKeyRequiredError:
      type: object
      additionalProperties: false
      required: [error, code]
      properties:
        error:
          type: string
        code:
          type: string
          const: provider_key_required

    ValidationError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
        details:
          type: string

    ExpectedTenantMismatch:
      type: object
      additionalProperties: false
      required: [error, acting_tenant]
      properties:
        error:
          type: string
          const: expected tenant mismatch
        acting_tenant:
          type: string

    UnavailableError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable unavailable reason
        id:
          type: string
          description: Present when an id was allocated before the failure

    QuotaDeniedResponse:
      type: object
      additionalProperties: false
      required: [error, code, limit, reset_at]
      properties:
        error:
          type: string
        code:
          type: string
          enum: [rate_limited, quota_exhausted]
        limit:
          type: string
          enum: [request_rate, hourly, monthly]
        reset_at:
          type: string
          format: date-time

    UsageGuardUnavailableResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          const: usage guard unavailable

    UnsupportedUrlError:
      type: object
      additionalProperties: false
      required: [error, code]
      properties:
        error:
          type: string
          description: Human-readable rejection reason; credentials are never echoed
        code:
          type: string
          const: unsupported_url

    WhoamiResponse:
      type: object
      additionalProperties: false
      required: [tenant_id, user_id, principal, tenant_data_plane, needs_provider_key, email]
      properties:
        tenant_id:
          type: string
        user_id:
          type: string
        principal:
          type: string
          enum: [api_token, session]
        tenant_data_plane:
          type: boolean
        needs_provider_key:
          type: boolean
          description: |
            True when tenant provider keys are on and the tenant has no active
            key. Save, import and reprocess then answer 409
            `provider_key_required` until the reader connects one.
        email:
          type: string
          description: Verified display email for the authenticated user
        csrf_token:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: |
            Session principals only. HMAC of the session id under the `csrf`
            HKDF domain. Omit for bearer principals.

    AuthChallengeBody:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          minLength: 1
        turnstile_token:
          type: string
          nullable: true
          description: |
            Open-mode challenges that would send mail. invite_only and closed
            ignore this field. Null, blank, or omitted is treated as missing
            (generic `{ ok: true }`, no send) rather than 400.

    AuthChallengeResponse:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true

    AuthLoginOptionsResponse:
      type: object
      additionalProperties: false
      required: [turnstile_site_key]
      properties:
        turnstile_site_key:
          type: string
          minLength: 1
          nullable: true
          description: |
            Public Turnstile site key when `signup_mode` is `open` and
            `TURNSTILE_SITE_KEY` is configured; otherwise null.

    AuthRedeemBody:
      type: object
      additionalProperties: false
      required: [credential, redemption_id]
      properties:
        credential:
          type: string
          minLength: 1
        redemption_id:
          type: string
          minLength: 1

    AuthEmailChangeBody:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          minLength: 1

    AuthRedeemResponse:
      type: object
      additionalProperties: false
      required: [tenant_id, user_id, email, principal]
      properties:
        tenant_id:
          type: string
        user_id:
          type: string
        email:
          type: string
        principal:
          type: string
          const: session

    AuthLogoutResponse:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true

    DeleteAccountBody:
      type: object
      additionalProperties: false
      required: [confirm]
      properties:
        confirm:
          type: string
          const: delete

    DeleteAccountResponse:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true

    ArchiveExportStatus:
      type: string
      enum: [queued, building, ready, failed, expired, cancelled]

    ArchiveExportError:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          minLength: 1

    ArchiveExportSummary:
      type: object
      additionalProperties: false
      required: [id, status, requested_at, started_at, completed_at, expires_at, error]
      properties:
        id:
          type: string
          minLength: 1
        status:
          $ref: "#/components/schemas/ArchiveExportStatus"
        requested_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        error:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ArchiveExportError"

    PostArchiveExportResponse:
      type: object
      additionalProperties: false
      required: [id, status]
      properties:
        id:
          type: string
          minLength: 1
        status:
          type: string
          const: queued

    ArchiveExportActiveError:
      type: object
      additionalProperties: false
      required: [error, id]
      properties:
        error:
          type: string
          const: export_active
        id:
          type: string
          minLength: 1

    ArchiveExportDailyLimit:
      type: object
      additionalProperties: false
      required: [limit, reset_at]
      properties:
        limit:
          type: string
          const: daily_export
        reset_at:
