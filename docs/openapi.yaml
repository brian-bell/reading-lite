          type: integer
          minimum: 1
          description: The cap enforcement uses. Never above the operator default.
        reset_at_ms:
          type: integer
          minimum: 0
          description: Epoch milliseconds of the next UTC midnight.
        observed_at_ms:
          type: integer
          minimum: 0
          description: When the spend guard read its counters.

