openapi: 3.1.0
info:
  title: reading-lite API
  version: 1.0.0
  summary: Personal reading corpus on Cloudflare Workers
  description: |
    Submit a URL (or import Markdown), get a structured summary, and search the
    corpus. All routes except `/health` and the magic-link challenge/redeem endpoints
    require authentication.     Browser sessions use a host-only `__Host-session`
    cookie; programmatic clients use `Authorization: Bearer`. Scopes gate each
    reading operation (`readings:read`, `readings:write`, `readings:import`,
    `readings:delete`). Cookie-authenticated POST and DELETE requests also
    require header `X-CSRF-Token` (session-bound HMAC from `GET /api/whoami`).
    Bearer requests are exempt. Missing or invalid CSRF returns 403.

    Optional header `X-Expected-Tenant` pins the tenant layout the client
    expects (`usr_…` or `global`). When present, a mismatch returns 412 before
    any store write.

    Local `wrangler dev` has no Queue or Vectorize binding: submit/reprocess/
    import return 503, and similar returns an empty list.
  contact:
    url: https://github.com/brian-bell/reading-lite
servers:
  - url: https://reading-lite.bbell.dev
    description: Production
  - url: http://127.0.0.1:8787
    description: Local wrangler dev
tags:
  - name: health
    description: Unauthenticated liveness
  - name: identity
    description: Authenticated principal introspection
  - name: readings
    description: Corpus read and write paths
security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Worker is up
          content:
            text/plain:
              schema:
                type: string
                const: ok

  /api/whoami:
    get:
      tags: [identity]
      operationId: getWhoami
      summary: Authenticated principal identity
      description: |
        Returns the tenant and user the caller acts as, plus whether
        `TENANT_DATA_PLANE=1`. No scope gate beyond authentication. Session
        principals also receive `csrf_token` for cookie mutations; bearer
        principals omit that field.
      responses:
        "200":
          description: Principal identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhoamiResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/AuthMisconfigured"

  /api/auth/challenge:
    post:
      tags: [identity]
      operationId: requestAuthChallenge
      summary: Request a magic-link login challenge
      security: []
      description: |
        Same-origin. Always returns a generic `{ ok: true }` so callers cannot
        enumerate users or invites. Existing active users can request a link in
        every signup mode. Unknown addresses are eligible only when current
        policy plus a `signup_invites` row allow provisioning. Issuing a new
        login challenge revokes any prior unconsumed challenge for that
        canonical email. The 15-minute secret is delivered out of band and
        lives in the SPA URL fragment, not this response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthChallengeBody"
      responses:
        "200":
          description: Generic acknowledgement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthChallengeResponse"
        "400":
          $ref: "#/components/responses/InvalidBody"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/auth/redeem:
    post:
      tags: [identity]
      operationId: redeemAuthChallenge
      summary: Redeem a magic-link challenge into a host-only session cookie
      security: []
      description: |
        Same-origin POST of the fragment secret after an explicit user
        gesture. Idempotent for the same `redemption_id`; a competing claimant
        fails. Sets a durable host-only `__Host-session` cookie
        (`Secure; HttpOnly; Path=/; SameSite=Lax; Max-Age=7776000`) so login
        survives browser restart. D1 still enforces a 30-day inactivity
        timeout and 90-day absolute expiry. If the request already carries a
        live session cookie for the same user, login redemption refreshes
        `authenticated_at_ms` on that row instead of inserting another session.

        Challenges with `purpose=email_change` complete a verified email swap
        instead of issuing a session: they do not provision users or consult
        signup eligibility. Confirm requires the live browser session that
        called `POST /api/auth/email-change`. Cookie-less redeem returns 401
        and does not swap, consume, revoke, or send security mail. A cookie
        that is not that confirming session (other device, other session,
        expired, or revoked) returns 403 with the same no-commit behavior.
        A matching live confirming session must also send `Origin` and
        `X-CSRF-Token` (403 on CSRF failure). Login redeem does not require
        CSRF and still mints a session when no cookie is present.

        The unique canonical email is swapped atomically; a uniqueness race
        fails closed. Other sessions and all `api_tokens` are revoked; the
        confirming session is kept. The previous address receives a security
        notification. Click/open tracking is a Resend domain setting (off by
        default), not a send-payload field.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRedeemBody"
      responses:
        "200":
          description: Session issued
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthRedeemResponse"
        "400":
          $ref: "#/components/responses/InvalidBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Competing claimant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /api/auth/logout:
    post:
      tags: [identity]
      operationId: logoutSession
      summary: Revoke the current browser session and clear the cookie
      security: []
      description: |
        Same-origin. Revokes the D1 session and expires `__Host-session`.
        Cookie callers must send `X-CSRF-Token`; a missing or invalid token
        returns 403 without clearing the cookie.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLogoutResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/auth/sessions:
    get:
      tags: [identity]
      operationId: listAuthSessions
      summary: List the caller's browser sessions
      description: |
        Returns session rows for the authenticated user (id, created,
        authenticated, last-seen, idle/absolute expiry, revoked, reason,
        user-agent label, usable). Marks the current cookie session via
        `current`. Idle- or absolute-expired rows stay in the list with
        `usable: false` so the client can inspect them. When the account
        is at the ten-session cap, `session_cap_warning` is a non-null
        string the client can show before the next login evicts the
        least-recently-used session. CSRF is not required (GET).
      responses:
        "200":
          description: Session list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSessionsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/AuthMisconfigured"

  /api/auth/sessions/revoke-all:
    post:
      tags: [identity]
      operationId: revokeAllAuthSessions
      summary: Revoke every browser session and log the caller out
      description: |
        Soft-revokes all of the caller's sessions. Cookie callers must send
        `X-CSRF-Token`; recent-auth is not required. The current cookie is
        cleared. Sends a security notification (no secrets) only when at least
        one session was actually revoked. Click/open tracking is a Resend
        domain setting (off by default), not a send-payload field.
        Single-session revoke does not send mail.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: All sessions revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionRevokeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/AuthMisconfigured"

  /api/auth/sessions/{id}:
    delete:
      tags: [identity]
      operationId: revokeAuthSession
      summary: Revoke one browser session
      description: |
        Soft-revokes one of the caller's sessions. Cookie callers must send
        `X-CSRF-Token`; recent-auth is not required. If the id is the current
        session, the cookie is cleared. Does not send security mail.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: "^ses_"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionRevokeResponse"
        "400":
          $ref: "#/components/responses/InvalidBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/auth/tokens:
    get:
      tags: [identity]
      operationId: listAuthTokens
      summary: List the caller's API tokens
      description: |
        Session cookie only (bearer 403). CSRF is not required (GET). Returns
        token metadata without secrets (`id`, name, format, scopes, timestamps,
        `usable`). Revoked and expired rows stay in the list with
        `usable: false`. The founder legacy token is included.
      responses:
        "200":
          description: Token list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListTokensResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/AuthMisconfigured"
    post:
      tags: [identity]
      operationId: createAuthToken
      summary: Mint a standard API token
      description: |
        Session cookie plus `X-CSRF-Token`. Requires recent magic-link
        authentication (10 minutes). Bearer 403. Body `{ name, scopes,
        expires_at_ms? }`. Mints `format=standard` HMAC material and returns
        the `tok_{uuid}.{hex}` credential once. Default expiry is 90 days;
        `expires_at_ms` may not exceed now + 90 days. Empty or unknown scopes
        are rejected. At 10 active tokens (including the founder legacy row)
        returns 409. Sends a security notification on create (no secrets).
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCreateTokenBody"
      responses:
        "201":
          description: Token minted (secret returned once)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthCreateTokenResponse"
        "400":
          $ref: "#/components/responses/InvalidBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Forbidden principal, CSRF, or recent authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: Ten active tokens already exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: too many active tokens
        "500":
          $ref: "#/components/responses/AuthMisconfigured"

  /api/auth/tokens/{id}:
    delete:
      tags: [identity]
      operationId: revokeAuthToken
      summary: Revoke one API token
      description: |
        Session cookie plus `X-CSRF-Token`. Recent-auth is not required.
        Bearer 403. Soft-revokes a token owned by the caller. Does not send
        security mail. Does not mark pending work failed; queued jobs recheck
        the token on admit. 404 if the id is not owned.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: "^tok_"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Token revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenRevokeResponse"
        "400":
          $ref: "#/components/responses/InvalidBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/auth/email-change:
    post:
      tags: [identity]
      operationId: requestEmailChange
      summary: Request a verified login-email change
      description: |
        Session cookie plus `X-CSRF-Token`. Requires recent magic-link
        authentication (10 minutes). Body `{ email }` is the new address.
        Always returns a generic `{ ok: true }` so callers cannot enumerate
        whether that address is already taken. Issues a 15-minute
        `purpose=email_change` challenge bound to the caller `user_id` and
        the requesting session. Confirm via `POST /api/auth/redeem` from that
        same signed-in browser (fragment + explicit POST). Cookie-less or
        other-session redeem does not swap. Does not consult signup
        eligibility. Does not change staging `AUTH_MAIL_ALLOWLIST`.
        Click/open tracking is a Resend domain setting (off by default), not a
        send-payload field.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthEmailChangeBody"
      responses:
        "200":
          description: Generic acknowledgement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthChallengeResponse"
        "400":
          $ref: "#/components/responses/InvalidBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Forbidden origin, CSRF, bearer, or recent authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "500":
          $ref: "#/components/responses/AuthMisconfigured"

  /api/readings:
    parameters:
      - $ref: "#/components/parameters/ExpectedTenant"
    get:
      tags: [readings]
      operationId: listReadings
      summary: List readings (newest first)
      description: |
        Server-side filter against denormalized `index/list.json`. `q` is a
        case-insensitive substring across title, tldr, url, and keywords.
        `tag` is an exact case-insensitive match on tags only.
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: tag
          in: query
          schema:
            type: string
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Page of list-index items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListReadingsResponse"
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "412":
          $ref: "#/components/responses/ExpectedTenantMismatch"
      x-required-scope: readings:read
    post:
      tags: [readings]
      operationId: submitReading
      summary: Submit a URL for processing
      description: |
        Claims by-url ownership, writes a pending manifest, and enqueues a job.
        Ready/pending owners return 200 with the existing manifest. Failed
        owners reprocess the same id (202).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostReadingsBody"
      responses:
        "200":
          description: Existing ready or pending owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Manifest"
        "202":
          description: New or reprocessed pending attempt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivatedReading"
        "400":
          $ref: "#/components/responses/InvalidBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/IntakeConflict"
        "412":
          $ref: "#/components/responses/ExpectedTenantMismatch"
        "503":
          $ref: "#/components/responses/Unavailable"
      x-required-scope: readings:write

  /api/readings/import-markdown:
    parameters:
      - $ref: "#/components/parameters/ExpectedTenant"
    post:
      tags: [readings]
      operationId: importMarkdown
      summary: Import Markdown as a reading
      description: |
        Uses `source_url` for identity/dedupe, skips fetching, and processes the
        supplied Markdown. Defaults `email` to false. Ready/pending owners
        return 200; failed owners reprocess the same id (202).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostReadingsImportMarkdownBody"
      responses:
        "200":
          description: Existing ready or pending owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Manifest"
        "202":
          description: New or reprocessed pending attempt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivatedReading"
        "400":
          $ref: "#/components/responses/InvalidBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/IntakeConflict"
        "412":
          $ref: "#/components/responses/ExpectedTenantMismatch"
        "503":
          $ref: "#/components/responses/Unavailable"
      x-required-scope: readings:import

  /api/readings/lookup:
    parameters:
      - $ref: "#/components/parameters/ExpectedTenant"
    get:
      tags: [readings]
      operationId: lookupReadingByUrl
      summary: Resolve the owner id for a URL
      description: |
        Side-effect-free. Only a live, valid by-url pointer resolves. Does not
        claim cold legacy pointers or repair damaged ones.
      security:
        - bearerAuth: []
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
            format: uri
      responses:
        "200":
          description: Owner found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LookupResponse"
        "400":
          description: Missing url
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: missing url
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Owner pointer still initializing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InitializingConflict"
        "412":
          $ref: "#/components/responses/ExpectedTenantMismatch"
      x-required-scope: readings:read

  /api/readings/similar:
    parameters:
      - $ref: "#/components/parameters/ExpectedTenant"
    post:
      tags: [readings]
      operationId: querySimilarReadings
      summary: Top-K similar readings by embedding
      description: |
        Queries Vectorize. Without a Vectorize binding (local dev), returns
        `{ "items": [] }`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostReadingsSimilarBody"
      responses:
        "200":
          description: Similarity hits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostReadingsSimilarResponse"
        "400":
          $ref: "#/components/responses/InvalidBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "412":
          $ref: "#/components/responses/ExpectedTenantMismatch"
      x-required-scope: readings:write

  /api/readings/{id}:
    parameters:
      - $ref: "#/components/parameters/ExpectedTenant"
      - $ref: "#/components/parameters/ReadingId"
    get:
      tags: [readings]
      operationId: getReading
      summary: Get a reading manifest
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Manifest (stale pending/attempts may be annotated as failed at read time)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Manifest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/ExpectedTenantMismatch"
      x-required-scope: readings:read
    delete:
      tags: [readings]
      operationId: deleteReading
      summary: Purge a reading
      description: |
        Visibility-first purge: Vectorize vector, owned by-url pointer, list
        row, R2 objects under the prefix, by-id pointer last. 409 while an
        attempt is actively running (stale attempts past the pending TTL do
        not block). Inbound `connections` on other readings may still name the
        deleted id.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Purge report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteReadingResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Active attempt in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: reading already has an active attempt
        "412":
          $ref: "#/components/responses/ExpectedTenantMismatch"
      x-required-scope: readings:delete

  /api/readings/{id}/diagnostics:
    parameters:
      - $ref: "#/components/parameters/ExpectedTenant"
      - $ref: "#/components/parameters/ReadingId"
    get:
      tags: [readings]
      operationId: getReadingDiagnostics
      summary: Inspect manifest, pointers, objects, and attempts
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Diagnostics bundle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetReadingDiagnosticsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/ExpectedTenantMismatch"
      x-required-scope: readings:read

  /api/readings/{id}/reprocess:
    parameters:
      - $ref: "#/components/parameters/ExpectedTenant"
      - $ref: "#/components/parameters/ReadingId"
    post:
      tags: [readings]
      operationId: reprocessReading
      summary: Start a fresh processing attempt
      description: |
        Optional empty body. `force: true` bypasses an active-attempt conflict.
        Optional `source: { kind: "markdown", … }` reprocesses supplied Markdown
        instead of re-fetching the URL (and takes precedence over stored
        Markdown). On success the reading becomes `source_type: "markdown"`;
        on failure prior source type is retained, and a previously ready
        reading rolls back to its preserved manifest. Markdown must fit the
        Cloudflare 128 KB queue-message limit or the attempt rolls back with
        503.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostReadingReprocessBody"
      responses:
        "200":
          description: Existing ready/pending outcome (rare for reprocess)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Manifest"
        "202":
          description: Reprocess enqueued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivatedReading"
        "400":
          $ref: "#/components/responses/InvalidBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/IntakeConflict"
        "412":
          $ref: "#/components/responses/ExpectedTenantMismatch"
        "503":
          $ref: "#/components/responses/Unavailable"
      x-required-scope: readings:write

  /api/readings/{id}/content:
    parameters:
      - $ref: "#/components/parameters/ExpectedTenant"
      - $ref: "#/components/parameters/ReadingId"
    get:
      tags: [readings]
      operationId: getReadingContent
      summary: Stream extracted Markdown
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Extracted markdown (`extracted.md`)
          content:
            text/markdown:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Missing reading, or `content_status` is not `captured`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "412":
          $ref: "#/components/responses/ExpectedTenantMismatch"
      x-required-scope: readings:read

  /api/readings/{id}/content/raw:
    parameters:
      - $ref: "#/components/parameters/ExpectedTenant"
      - $ref: "#/components/parameters/ReadingId"
    get:
      tags: [readings]
      operationId: getReadingRawContent
      summary: Stream raw captured bytes
      description: Returns the original bytes with the stored `content_type`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Raw source bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/ExpectedTenantMismatch"
      x-required-scope: readings:read

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Founder legacy bearer (or session token) looked up in D1. Runtime auth
        does not fall back to the `READER_API_TOKEN` secret itself.

  parameters:
    ReadingId:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        description: Reading id (typically `rd_…`)
    ExpectedTenant:
      name: X-Expected-Tenant
      in: header
      required: false
      schema:
        type: string
        description: |
          Layout pin: principal tenant id (`usr_…`) when the data-plane gate is
          on, or `global` when it is off. Mismatch → 412.
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      schema:
        type: string
        pattern: "^[0-9a-f]{64}$"
        description: |
          Session-bound HMAC over the session id (HKDF domain `csrf`). Required
          on cookie-authenticated POST and DELETE. Bearer requests omit it.
          Missing or invalid → 403 (the session cookie stays).

  responses:
    Unauthorized:
      description: Missing or invalid bearer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
          example:
            error: unauthorized
    Forbidden:
      description: |
        Authenticated but lacking scope, forbidden principal, or invalid
        cookie CSRF token (session stays; SPA must not treat this as logout).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
          example:
            error: forbidden
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
          example:
            error: not found
    InvalidBody:
      description: Request body failed zod validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"
    InvalidQuery:
      description: Query string failed zod validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"
          example:
            error: invalid query
            details: "…"
    ExpectedTenantMismatch:
      description: >
        X-Expected-Tenant does not match the layout this request would use
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ExpectedTenantMismatch"
    AuthMisconfigured:
      description: Control-plane or auth-root secret missing/invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
          example:
            error: auth misconfigured
    IntakeConflict:
      description: |
        Owner still initializing, active attempt in progress, or markdown
        content unavailable for the requested operation.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/InitializingConflict"
              - $ref: "#/components/schemas/ErrorMessage"
    Unavailable:
      description: |
        Queue unbound, claim/activation contention, or queue send failure
        (includes oversized reprocess Markdown that cannot be enqueued).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UnavailableError"

  schemas:
    ErrorMessage:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string

    ValidationError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
        details:
          type: string

    ExpectedTenantMismatch:
      type: object
      additionalProperties: false
      required: [error, acting_tenant]
      properties:
        error:
          type: string
          const: expected tenant mismatch
        acting_tenant:
          type: string

    InitializingConflict:
      type: object
      additionalProperties: false
      required: [error, id, poll]
      properties:
        error:
          type: string
          const: reading owner is still initializing
        id:
          type: string
        poll:
          type: string
          description: Relative poll path, e.g. `/api/readings/{id}`

    UnavailableError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable unavailable reason
        id:
          type: string
          description: Present when an id was allocated before the failure

    WhoamiResponse:
      type: object
      additionalProperties: false
      required: [tenant_id, user_id, principal, tenant_data_plane, email]
      properties:
        tenant_id:
          type: string
        user_id:
          type: string
        principal:
          type: string
          enum: [api_token, session]
        tenant_data_plane:
          type: boolean
        email:
          type: string
          description: Verified display email for the authenticated user
        csrf_token:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: |
            Session principals only. HMAC of the session id under the `csrf`
            HKDF domain. Omit for bearer principals.

    AuthChallengeBody:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          minLength: 1

    AuthChallengeResponse:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true

    AuthRedeemBody:
      type: object
      additionalProperties: false
      required: [credential, redemption_id]
      properties:
        credential:
          type: string
          minLength: 1
        redemption_id:
          type: string
          minLength: 1

    AuthEmailChangeBody:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          minLength: 1

    AuthRedeemResponse:
      type: object
      additionalProperties: false
      required: [tenant_id, user_id, email, principal]
      properties:
        tenant_id:
          type: string
        user_id:
          type: string
        email:
          type: string
        principal:
          type: string
          const: session

    AuthLogoutResponse:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true

    SessionListItem:
      type: object
      additionalProperties: false
      required:
        - id
        - current
        - created_at_ms
        - authenticated_at_ms
        - last_seen_at_ms
        - idle_expires_at_ms
        - absolute_expires_at_ms
        - revoked_at_ms
        - revocation_reason
        - user_agent_label
        - usable
      properties:
        id:
          type: string
          minLength: 1
        current:
          type: boolean
        created_at_ms:
          type: integer
        authenticated_at_ms:
          type: integer
        last_seen_at_ms:
          type: integer
        idle_expires_at_ms:
          type: integer
        absolute_expires_at_ms:
          type: integer
        revoked_at_ms:
          type: integer
          nullable: true
        revocation_reason:
          type: string
          nullable: true
        user_agent_label:
          type: string
          nullable: true
        usable:
          type: boolean
          description: |
            False when the session is revoked or past idle/absolute expiry.
            Expired rows remain in the list for inspect.

    ListSessionsResponse:
      type: object
      additionalProperties: false
      required: [sessions, session_cap_warning]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/SessionListItem"
        session_cap_warning:
          type: string
          nullable: true
          description: |
            Present when the account already has ten active sessions. The next
            sign-in from another device revokes the least-recently-used session.

    AuthSessionRevokeResponse:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true

    ApiScopeName:
      type: string
      enum:
        - readings:read
        - readings:write
        - readings:import
        - readings:delete

    AuthCreateTokenBody:
      type: object
      additionalProperties: false
      required: [name, scopes]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        scopes:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ApiScopeName"
        expires_at_ms:
          type: integer
          description: Absolute expiry. Defaults to now + 90 days; must not exceed that bound.

    AuthCreateTokenResponse:
      type: object
      additionalProperties: false
      required: [token, id, name, scopes, created_at_ms, expires_at_ms]
      properties:
        token:
          type: string
          minLength: 1
          description: One-time `tok_{uuid}.{hex}` credential. Never stored.
        id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/ApiScopeName"
        created_at_ms:
          type: integer
        expires_at_ms:
          type: integer

    ApiTokenListItem:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - format
        - scopes
        - created_at_ms
        - expires_at_ms
        - revoked_at_ms
        - last_used_at_ms
        - user_agent_label
        - usable
      properties:
        id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        format:
          type: string
          enum: [legacy, standard]
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/ApiScopeName"
        created_at_ms:
          type: integer
        expires_at_ms:
          type: integer
        revoked_at_ms:
          type: integer
          nullable: true
        last_used_at_ms:
          type: integer
          nullable: true
        user_agent_label:
          type: string
          nullable: true
        usable:
          type: boolean

    ListTokensResponse:
      type: object
      additionalProperties: false
      required: [tokens]
      properties:
        tokens:
          type: array
          items:
            $ref: "#/components/schemas/ApiTokenListItem"

    AuthTokenRevokeResponse:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true

    HttpUrl:
      type: string
      format: uri
      pattern: "^https?://"
      description: http(s) URL

    PostReadingsBody:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url:
          $ref: "#/components/schemas/HttpUrl"
        email:
          type: boolean
          description: Send completion email when configured (default true on submit)

    PostReadingsImportMarkdownBody:
      type: object
      additionalProperties: false
      required: [source_url, markdown]
      properties:
        source_url:
          $ref: "#/components/schemas/HttpUrl"
        title:
          type: string
          minLength: 1
        markdown:
          type: string
          minLength: 1
        email:
          type: boolean
          description: Defaults to false on import

    ReprocessMarkdownSource:
      type: object
      additionalProperties: false
      required: [kind, markdown]
      properties:
        kind:
          type: string
          const: markdown
        markdown:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1

    PostReadingReprocessBody:
      type: object
      additionalProperties: false
      properties:
        force:
          type: boolean
          default: false
        email:
          type: boolean
          description: Defaults to false on reprocess
        source:
          $ref: "#/components/schemas/ReprocessMarkdownSource"

    ActivatedReading:
      type: object
      additionalProperties: false
      required: [id, status, poll, attempt_id]
      properties:
        id:
          type: string
        status:
          type: string
          const: pending
        poll:
          type: string
          description: Relative path to poll, e.g. `/api/readings/{id}`
        attempt_id:
          type: string

    LookupResponse:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id:
          type: string

    PostReadingsSimilarBody:
      type: object
      additionalProperties: false
      required: [query_embedding]
      properties:
        query_embedding:
          type: array
          minItems: 1536
          maxItems: 1536
          items:
            type: number
        k:
          type: integer
          minimum: 1
          maximum: 50
          default: 10

    SimilarItem:
      type: object
      additionalProperties: false
      required: [id, url, score]
      properties:
        id:
          type: string
        url:
          type: string
          format: uri
        title:
          type: string
        tags:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        score:
          type: number

    PostReadingsSimilarResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SimilarItem"

    DeleteReadingResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - vector_delete_requested
        - list_row_removed
        - by_url_released
        - objects_deleted
      properties:
        id:
          type: string
          minLength: 1
        vector_delete_requested:
          type: boolean
          description: Vectorize deleteByIds was issued (existence not reported)
        list_row_removed:
          type: boolean
        by_url_released:
          type: boolean
          description: False when another surviving reading owns the by-url slot
        objects_deleted:
          type: integer
          minimum: 0

    ManifestStatus:
      type: string
      enum: [pending, ready, failed]

    SourceType:
      type: string
      enum: [url, markdown]

    ContentStatus:
      type: string
      enum: [captured, raw_only, failed]

    NoveltyVerdict:
      type: string
      enum: [novel, familiar, duplicate]

    ProcessingAttemptTrigger:
      type: string
      enum: [submit, reprocess, import]

    ProcessingAttemptStatus:
      type: string
      enum: [running, succeeded, failed]

    ProcessingStage:
      type: string
      enum:
        - queued
        - fetch_source
        - prepare_markdown
        - write_raw
        - write_extracted
        - embed_source
        - query_similar
        - summarize
        - embed_summary
        - upsert_vector
        - write_manifest
        - write_indexes
        - send_email

    Sha256Hex:
      type: string
      pattern: "^[0-9a-f]{64}$"
      description: 64 lowercase hex chars

    ManifestError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        stage:
          $ref: "#/components/schemas/ProcessingStage"
        failed_at:
          type: string
          format: date-time
        retryable:
          type: boolean

    ProcessingAttemptSummary:
      type: object
      additionalProperties: false
      required: [id, trigger, status, started_at]
      properties:
        id:
          type: string
          minLength: 1
        trigger:
          $ref: "#/components/schemas/ProcessingAttemptTrigger"
        status:
          $ref: "#/components/schemas/ProcessingAttemptStatus"
        stage:
          $ref: "#/components/schemas/ProcessingStage"
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        error:
          $ref: "#/components/schemas/ManifestError"

    ProcessingAttemptEvent:
      type: object
      additionalProperties: false
      required: [stage, status, at]
      properties:
        stage:
          $ref: "#/components/schemas/ProcessingStage"
        status:
          type: string
          enum: [started, succeeded, failed]
        at:
          type: string
          format: date-time
        duration_ms:
          type: number
          minimum: 0
        error:
          $ref: "#/components/schemas/ManifestError"

    ProcessingAttempt:
      type: object
      additionalProperties: false
      required:
        - id
        - trigger
        - status
        - started_at
        - reading_id
        - url
        - url_hash
        - key_prefix
        - events
      properties:
        id:
          type: string
          minLength: 1
        trigger:
          $ref: "#/components/schemas/ProcessingAttemptTrigger"
        status:
          $ref: "#/components/schemas/ProcessingAttemptStatus"
        stage:
          $ref: "#/components/schemas/ProcessingStage"
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        error:
          $ref: "#/components/schemas/ManifestError"
        reading_id:
          type: string
          minLength: 1
        url:
          type: string
          format: uri
        url_hash:
          $ref: "#/components/schemas/Sha256Hex"
        key_prefix:
          type: string
          minLength: 1
        events:
          type: array
          items:
            $ref: "#/components/schemas/ProcessingAttemptEvent"

    SimilaritySnapshot:
      type: object
      additionalProperties: false
      required: [count, computed_at]
      properties:
        count:
          type: integer
          minimum: 0
        max:
          type: number
        mean:
          type: number
        computed_at:
          type: string
          format: date-time

    Connection:
      type: object
      additionalProperties: false
      required: [id, reason]
      properties:
        id:
          type: string
          minLength: 1
        reason:
          type: string
          minLength: 1

    TensionKind:
      type: string
      description: >-
        Directional relationship from this reading's point of view.
        `supersedes` means this reading supersedes `id`; `superseded_by` means
        `id` supersedes this reading; likewise `qualifies` / `qualified_by`.
        `contradicts` is symmetric.
      enum: [contradicts, supersedes, superseded_by, qualifies, qualified_by]

    Tension:
      type: object
      additionalProperties: false
      required: [id, kind, reason, computed_at]
      properties:
        id:
          type: string
          minLength: 1
        kind:
          $ref: "#/components/schemas/TensionKind"
        reason:
          type: string
          minLength: 1
        computed_at:
          type: string
          format: date-time

    TensionJudged:
      type: object
      additionalProperties: false
      required: [id, judged_at]
      properties:
        id:
          type: string
          minLength: 1
        judged_at:
          type: string
          format: date-time

    OpenAISummarizationUsage:
      type: object
      additionalProperties: false
      required:
        - provider
        - model
        - input_tokens
        - output_tokens
        - reasoning_tokens
        - cached_input_tokens
        - cache_write_tokens
      properties:
        provider:
          type: string
          const: openai
        model:
          type: string
          minLength: 1
        input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0
        reasoning_tokens:
          type: integer
          minimum: 0
        cached_input_tokens:
          type: integer
          minimum: 0
        cache_write_tokens:
          type: integer
          minimum: 0

    AnthropicSummarizationUsage:
      type: object
      additionalProperties: false
      required:
        - provider
        - model
        - input_tokens
        - output_tokens
        - cache_creation_input_tokens
        - cache_read_input_tokens
      properties:
        provider:
          type: string
          const: anthropic
        model:
          type: string
          minLength: 1
        input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0
        cache_creation_input_tokens:
          type: integer
          minimum: 0
        cache_read_input_tokens:
          type: integer
          minimum: 0

    SummarizationUsage:
      oneOf:
        - $ref: "#/components/schemas/OpenAISummarizationUsage"
        - $ref: "#/components/schemas/AnthropicSummarizationUsage"
      discriminator:
        propertyName: provider
        mapping:
          openai: "#/components/schemas/OpenAISummarizationUsage"
          anthropic: "#/components/schemas/AnthropicSummarizationUsage"

    LegacyUsage:
      type: object
      additionalProperties: false
      required:
        - anthropic_input_tokens
        - anthropic_output_tokens
        - openai_embedding_tokens
      properties:
        anthropic_input_tokens:
          type: integer
          minimum: 0
        anthropic_output_tokens:
          type: integer
          minimum: 0
        openai_embedding_tokens:
          type: integer
          minimum: 0

    UsageV2:
      type: object
      additionalProperties: false
      required: [summarization, openai_embedding_tokens]
      properties:
        summarization:
          $ref: "#/components/schemas/SummarizationUsage"
        openai_embedding_tokens:
          type: integer
          minimum: 0

    Usage:
      oneOf:
        - $ref: "#/components/schemas/LegacyUsage"
        - $ref: "#/components/schemas/UsageV2"

    Manifest:
      type: object
      additionalProperties: false
      required:
        - id
        - url
        - url_hash
        - status
        - content_type
        - content_status
        - content_bytes
        - content_sha256
        - created_at
        - updated_at
      properties:
        id:
          type: string
          minLength: 1
        url:
          type: string
          format: uri
        url_hash:
          $ref: "#/components/schemas/Sha256Hex"
        source_type:
          $ref: "#/components/schemas/SourceType"
        status:
          $ref: "#/components/schemas/ManifestStatus"
        error:
          $ref: "#/components/schemas/ManifestError"
        active_attempt:
          $ref: "#/components/schemas/ProcessingAttemptSummary"
        last_attempt:
          $ref: "#/components/schemas/ProcessingAttemptSummary"
        preserve_ready_manifest:
          description: Internal rollback snapshot; opaque to clients
        title:
          type: string
          minLength: 1
        tldr:
          type: string
          minLength: 1
        tags:
          type: array
          items:
            type: string
        keywords:
          type: array
          items:
            type: string
        people:
          type: array
          items:
            type: string
        orgs:
          type: array
          items:
            type: string
        novelty_verdict:
          $ref: "#/components/schemas/NoveltyVerdict"
        similarity:
          $ref: "#/components/schemas/SimilaritySnapshot"
        connections:
          type: array
          items:
            $ref: "#/components/schemas/Connection"
        connections_computed_at:
          type: string
          format: date-time
          description: Time of the latest relationship-only judgement
        connections_neighbourhood_ids:
          type: array
          items:
            type: string
          description: Reading IDs considered by the latest relationship judgement (ingest or relationship-only refresh)
        tensions:
          type: array
          description: >-
            Directional tensions written by the offline tension refresh; never
            produced by ingest.
          items:
            $ref: "#/components/schemas/Tension"
        tensions_judged:
          type: array
          description: >-
            Pairwise tension judgements already made (including "none"
            verdicts) so a stable pair is not re-judged.
          items:
            $ref: "#/components/schemas/TensionJudged"
        summary_markdown:
          type: string
        content_type:
          type: string
          minLength: 1
        content_status:
          $ref: "#/components/schemas/ContentStatus"
        content_bytes:
          type: integer
          minimum: 0
        extracted_bytes:
          type: integer
          minimum: 0
        content_sha256:
          $ref: "#/components/schemas/Sha256Hex"
        fetched_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        usage:
          $ref: "#/components/schemas/Usage"

    ListIndexItem:
      type: object
      additionalProperties: false
      required: [id, key_prefix, url, status, created_at]
      properties:
        id:
          type: string
          minLength: 1
        key_prefix:
          type: string
          minLength: 1
        url:
          type: string
          format: uri
        title:
          type: string
          minLength: 1
        tldr:
          type: string
          minLength: 1
        tags:
          type: array
          items:
            type: string
        keywords:
          type: array
          items:
            type: string
        status:
          $ref: "#/components/schemas/ManifestStatus"
        novelty_verdict:
          $ref: "#/components/schemas/NoveltyVerdict"
        similarity:
          $ref: "#/components/schemas/SimilaritySnapshot"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        error:
          $ref: "#/components/schemas/ManifestError"
        active_attempt:
          $ref: "#/components/schemas/ProcessingAttemptSummary"
        last_attempt:
          $ref: "#/components/schemas/ProcessingAttemptSummary"

    ListReadingsResponse:
      type: object
      additionalProperties: false
      required: [readings, limit, offset, has_more]
      properties:
        readings:
          type: array
          items:
            $ref: "#/components/schemas/ListIndexItem"
        limit:
          type: integer
          minimum: 0
        offset:
          type: integer
          minimum: 0
        has_more:
          type: boolean

    ByUrlPointer:
      type: object
      additionalProperties: false
      required: [id, key_prefix]
      properties:
        id:
          type: string
          minLength: 1
        key_prefix:
          type: string
          minLength: 1

    PointerDiagnostic:
      type: object
      additionalProperties: false
      required: [exists, matches_manifest]
      properties:
        exists:
          type: boolean
        pointer:
          $ref: "#/components/schemas/ByUrlPointer"
        matches_manifest:
          type: boolean

    ReadingObjectInfo:
      type: object
      additionalProperties: false
      required: [key, size]
      properties:
        key:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 0
        uploaded:
          type: string

    GetReadingDiagnosticsResponse:
      type: object
      additionalProperties: false
      required: [id, key_prefix, manifest, index_item, pointers, objects, attempts]
      properties:
        id:
          type: string
          minLength: 1
        key_prefix:
          type: string
          minLength: 1
        manifest:
          $ref: "#/components/schemas/Manifest"
        index_item:
          oneOf:
            - $ref: "#/components/schemas/ListIndexItem"
            - type: "null"
        pointers:
          type: object
          additionalProperties: false
          required: [by_id, by_url]
          properties:
            by_id:
              $ref: "#/components/schemas/PointerDiagnostic"
            by_url:
              $ref: "#/components/schemas/PointerDiagnostic"
        objects:
          type: array
          items:
            $ref: "#/components/schemas/ReadingObjectInfo"
        attempts:
          type: array
          items:
            $ref: "#/components/schemas/ProcessingAttempt"
