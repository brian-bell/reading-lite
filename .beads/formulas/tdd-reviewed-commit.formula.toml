formula = "tdd-reviewed-commit"
description = "Plan a change as vertical TDD slices, revise it after exactly one plan review, implement it, autoreview the uncommitted patch to clean, and create one local commit."
version = 1
type = "workflow"
phase = "liquid"
pour = true

[vars.work_item]
description = "Issue ID or concise description of the change to implement"
required = true

[vars.base_branch]
description = "Remote base branch that the implementation branch must start from"
default = "main"
pattern = "^[A-Za-z0-9/_.-]+$"

[[steps]]
id = "plan"
title = "Write the detailed TDD implementation plan for {{work_item}}"
type = "task"
description = """Prepare an implementation-ready plan before changing production code.

1. Recover the active work context with `bd prime`; read the tracked work item,
   repository instructions, relevant plans/ADRs, and acceptance criteria.
2. Inspect the current branch, worktree, diff, remote/base relationship, relevant
   source, public interfaces, tests, configuration, documentation, and recent
   history. Preserve unrelated user changes. Do not modify production code.
3. State the intended observable behavior, scope, non-goals, assumptions, and any
   decision that would materially change the result. Stop for user direction only
   when such a decision cannot be resolved safely from repository context.
4. Identify the correct ownership boundaries and seams, including public API,
   configuration/environment contracts, validation, error behavior, compatibility,
   rollout or migration needs, and documentation updates.
5. Break implementation into ordered tracer-bullet slices. For every slice specify:
   - the single externally observable behavior it proves;
   - the public-interface test to add and the focused command to run;
   - the expected RED failure and why it demonstrates a missing behavior;
   - the minimum GREEN implementation;
   - any refactor allowed only after GREEN;
   - the focused proof that finishes the slice.
   Never batch all tests before all implementation.
6. Name the likely files and contracts affected, but keep tests coupled to behavior
   rather than private implementation shape.
7. End with documentation/configuration work, focused and full quality gates,
   autoreview expectations, commit scope, risks, and rollback or recovery notes.
8. Persist the complete plan in the active molecule/work item's design or notes
   (or in the repository's established plan artifact, recording its path in Beads).

Do not implement the plan in this step."""
acceptance = "A durable, implementation-ready plan defines behavior, scope, ownership, ordered vertical RED-GREEN-REFACTOR slices, exact test commands, affected contracts, quality gates, risks, and commit boundaries; no production implementation has started."

[[steps]]
id = "review-plan"
title = "Review and revise the TDD plan once for {{work_item}}"
type = "task"
needs = ["plan"]
description = """Freeze the written plan, perform exactly ONE critical review pass,
and then revise the plan exactly once.

1. Give one reviewer the plan, tracked work item, acceptance criteria, and necessary
   repository context. Use one independent reviewer invocation when available;
   otherwise perform one explicitly delimited critical self-review.
2. Review feasibility, public-behavior coverage, tracer-bullet ordering, correctness
   of RED expectations, validation seams, ownership boundaries, failure handling,
   compatibility/rollout, documentation, test commands, and scope control.
3. Verify each finding against the repository. Record findings as accepted,
   rejected, or requiring user direction, with a concise reason.
4. Revise the durable plan once to incorporate accepted findings and resolve any
   resulting dependency or ordering changes. Record a short review disposition
   alongside the revised plan.
5. Treat the revised plan as the implementation baseline.

Do not invoke an iterative review-loop skill, request a second opinion, or perform a
second plan review pass. If the user changes scope later, return to planning as new
work rather than silently treating it as another pass."""
acceptance = "One and only one plan review pass is recorded, every finding has a disposition, and one revised plan is persisted as the implementation baseline."

[[steps]]
id = "implement"
title = "Implement the revised plan with TDD for {{work_item}}"
type = "task"
needs = ["review-plan"]
description = """Implement only the revised plan using the repository's TDD skill and
vertical red-green-refactor discipline.

Before editing code:
1. Inspect `git status` and the existing diff; preserve unrelated changes.
2. Refresh `origin/{{base_branch}}` and follow repository instructions for starting
   from the latest base. Never implement or commit directly on `{{base_branch}}` or
   another protected branch; create or switch to a short task-specific branch
   without disturbing unrelated work. If safe synchronization or branch creation
   would overwrite work, stop and report the exact conflict.

For each planned tracer-bullet slice, in order:
1. RED: add one public-behavior test, run its focused command, and confirm it fails
   for the expected missing-behavior reason. A syntax, fixture, or setup failure is
   not a valid RED.
2. GREEN: make the smallest production change that passes that test, then run the
   focused test.
3. REFACTOR: only while GREEN, improve names/structure or remove duplication without
   expanding scope; rerun the focused proof after each refactor.
4. Record material deviations from the revised plan and why they were necessary.

After the slices:
- update affected schemas, configuration examples, operational guidance, and user
  documentation required by the behavior;
- format the touched files;
- run all focused tests and the repository's full relevant quality gates;
- inspect the final diff for accidental or unrelated changes.

Do not commit in this step."""
acceptance = "Every planned behavior was implemented through observed RED then GREEN cycles, refactors occurred only while green, required docs/config/contracts are synchronized, focused and full relevant gates pass, and the scoped patch remains uncommitted."

[[steps]]
id = "autoreview"
title = "Autoreview the uncommitted implementation for {{work_item}}"
type = "task"
needs = ["implement"]
description = """Run the installed autoreview skill as the final code closeout check
against the uncommitted patch.

1. Confirm formatting is complete and tests currently pass so review line numbers
   and evidence are current.
2. Resolve the autoreview helper from the installed skill directory and run it in
   local/uncommitted mode, supplying the revised plan and acceptance criteria as
   review context when useful. Use the skill's default engine/model/effort unless
   the user explicitly requested an override.
3. Treat findings as advisory. Verify every finding against the actual code path,
   adjacent files, and dependency contracts. Record accepted and rejected findings
   with reasons; reject speculative or out-of-scope rewrites.
4. Fix all verified actionable findings at the correct ownership boundary. When a
   finding represents a scoped bug class, inspect touched sibling surfaces.
5. After any review-triggered edit, rerun focused tests and the relevant full gates,
   then rerun the same autoreview helper. Continue until it exits clean with no
   accepted/actionable findings.
6. Record the final review command, tests/proof, finding dispositions, and clean
   result.

The earlier single-pass constraint applies only to review of the implementation
plan. Autoreview follows its own clean-closeout contract. Do not commit in this
step."""
acceptance = "The final autoreview helper run is clean with no accepted/actionable findings, all accepted fixes are proven by relevant tests, and the patch remains uncommitted."

[[steps]]
id = "commit"
title = "Create one local commit for {{work_item}}"
type = "task"
needs = ["autoreview"]
description = """Use the installed commit skill to create one safe local commit.

1. Confirm the implementation, tests, and clean autoreview result are still current.
2. Inspect the branch, `git status`, complete diff, and untracked files. Refresh
   remote state as required by the commit workflow. Never commit on
   `{{base_branch}}`, `main`, or another protected branch.
3. Identify the exact task-scoped changes. Exclude unrelated user work, caches,
   generated noise, build artifacts, and unrelated untracked files.
4. Stage only the intended files and review the staged diff.
5. Create exactly one non-empty local commit with a concise imperative message
   describing the behavior. Do not amend existing history, add a co-author trailer,
   push, or create/update a pull request.
6. If a hook modifies files or invalidates prior proof, stop before committing,
   return through the needed tests and autoreview, and only then retry the commit.
7. Verify the resulting commit with `git status` and `git show --stat --oneline
   HEAD`; report the commit hash, message, included scope, tests, and autoreview
   result. Follow the repository's Beads closeout protocol for completed work.

If there is nothing in scope to commit, report that plainly rather than creating an
empty commit."""
acceptance = "Exactly one scoped local commit exists on a non-protected branch, unrelated changes remain untouched, the commit is unpushed, and its hash plus validation and clean autoreview evidence are reported."
